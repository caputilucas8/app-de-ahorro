/* ---- movimientos ---- */
function movHTML(o,c){
  const list = [...o.movements].sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  let rows = list.map(m => {
    // La etiqueta congelada manda. El cálculo al vuelo queda solo como respaldo para
    // movimientos guardados antes de que existiera diasPlan, y nunca para los
    // automáticos (compras, sueldos, previos): ésos no te adelantan ni te atrasan.
    const dd = m.diasPlan != null ? m.diasPlan
             : (!m.excludeFromRate && !m.itemId ? diasQueMueve(m.amount, c) : null);
    const etiqueta = m.note || m.cat || (m.amount>=0?'Aporte':'Retiro');
    return `<div class="mv">
      <span class="d num">${fmtDate(m.date)}</span>
      <span class="n">${esc(etiqueta)}${
        m.cat && m.note ? `<span class="tag">${esc(m.cat)}</span>` : ''}${
        m.itemId ? '<span class="tag">compra</span>' : ''}${
        m.excludeFromRate && !m.itemId ? '<span class="tag">fuera del promedio</span>' : ''}</span>
      <span class="a num ${m.amount>=0?'in':'out'}">${m.amount>=0?'+':'−'}${usd(Math.abs(m.amount))}
        ${dd ? `<em class="dias">${dd>0?'te adelantó':'te atrasó'} ${Math.abs(dd)} d</em>` : ''}</span>
      <button class="x" data-del-mov="${m.id}" title="Borrar movimiento">${ico('x')}</button>
    </div>`;
  }).join('');

  // de dónde salió la plata (lo sin categoría también cuenta, si no el desglose miente)
  const porCat = new Map();
  o.movements.filter(m => m.amount > 0).forEach(m =>
    porCat.set(m.cat || 'Sin categoría', (porCat.get(m.cat || 'Sin categoría')||0) + m.amount));
  const top = [...porCat.entries()].sort((a,b) => b[1]-a[1]);
  const totalIn = top.reduce((s,[,v]) => s+v, 0);
  const desglose = top.length
    ? top.map(([k,v]) => `${esc(k)} <b>${Math.round(v/totalIn*100)}%</b>`).join(' · ')
    : '';

  if(!rows) rows = `<div class="hint" style="padding:14px 0">Sin movimientos todavía.</div>`;

  const semTxt = c.semanaActual !== 0
    ? `Esta semana llevás <b class="num" style="color:${c.semanaActual>0?'var(--acc)':'var(--bad)'}">${c.semanaActual>0?'+':'−'}${usd(Math.abs(c.semanaActual))} USD</b>`
    : `Esta semana todavía no metiste nada`;

  return `<div class="card">
    <div class="card-h">
      <h2>${ico('ledger')} Movimientos</h2>
      <div class="spacer"></div>
      <span class="chip num">Saldo <b>${usd(c.saldo)} USD</b></span>
    </div>
    <div class="card-b">
      <form id="fMov">
        <div class="row">
          <div class="f xs"><label>Fecha</label><input name="date" type="date" value="${today()}" max="${today()}" required></div>
          <div class="f sm"><label>Monto USD</label><input name="amount" type="number" step="0.01" min="0" placeholder="35" required></div>
          <div class="f" style="flex:0 0 168px">
            <label>Tipo</label>
            <div class="seg">
              <button type="button" class="on in" data-kind="in">Aporte</button>
              <button type="button" data-kind="out">Retiro</button>
            </div>
          </div>
          <div class="f sm"><label>Origen</label>
            <select name="cat" id="mvCat">${CATS_IN.map(x => `<option>${x}</option>`).join('')}</select></div>
          <div class="f"><label>Nota</label><input name="note" placeholder="Opcional" maxlength="60"></div>
          <button class="btn primary" type="submit">Cargar</button>
        </div>
        <label class="check" style="margin-top:11px">
          <input type="checkbox" name="excl">
          No contar este movimiento en el promedio semanal <span style="color:var(--dim)">(para ahorro previo o plata que ya tenías)</span>
        </label>
      </form>
      <div class="sep"></div>
      <div class="hint" style="margin-bottom:6px">${semTxt} · el ritmo se mide sobre los últimos
        ${c.ventanaDias} días, contando desde un aporte tuyo, para que no importe si ahorrás
        todos los días o una vez por mes.</div>
      ${desglose ? `<div class="hint" style="margin-bottom:8px">De dónde salió: ${desglose}</div>` : ''}
      <div class="mv-list">${rows}</div>
    </div>
  </div>`;
}

/* ---- gráfico: eje Y = dinero, eje X = días.
       Barra fina + punto en cada fecha con movimiento, unidos por una línea.
       Rango ajustable: semana / mes / todo hasta la fecha meta. ---- */
const CW = 860, CH = 350, CPL = 64, CPR = 30, CPT = 34, CPB = 46;
const CIW = CW-CPL-CPR, CIH = CH-CPT-CPB;

let chartRange  = 'todo';   // 'sem' | 'mes' | 'todo'
let chartOffset = 0;        // 0 = ventana más reciente; 1 = una ventana hacia atrás, etc.
let zoomStart   = 0;        // día donde arranca la ventana con zoom, contado desde d0
let zoomDays    = null;     // largo de la ventana en días; null = sin zoom, se ve todo
let yShift      = 0;        // desplazamiento vertical (en USD) del arrastre
let chartFullSpan = 1;      // largo total del objetivo en días; lo actualiza chartHTML
let chartAnchorDia = 0;     // día de "hoy" contado desde d0: ahí se ancla el zoom
let chartYAuto  = 1;        // alto de la banda visible en USD

function chartHTML(o,c){
  const W = CW, H = CH, PL = CPL, PR = CPR, PT = CPT, PB = CPB;
  const iw = CIW, ih = CIH;

  // --- serie acumulada completa (los movimientos del mismo día se juntan en un punto)
  const movs = [...o.movements].sort((a,b) => a.date.localeCompare(b.date));
  const porFecha = new Map();
  let acc = 0;
  movs.forEach(m => { acc += m.amount; porFecha.set(m.date, acc); });
  const serie = [...porFecha.entries()];

  const d0 = (serie.length && serie[0][0] < o.startDate) ? serie[0][0] : o.startDate;
  const d1 = (c.fechaEstim && c.fechaEstim !== 'cumplido' && diffDays(o.targetDate, c.fechaEstim) > 0)
             ? c.fechaEstim : o.targetDate;

  // --- ventana visible
  const N = chartRange === 'sem' ? 7 : chartRange === 'mes' ? 30 : 0;
  const fullSpan = Math.max(1, diffDays(d0, d1));
  chartFullSpan = fullSpan;

  let wa, wb;
  if(N){
    wb = addDays(c.hoy, -chartOffset*N);
    wa = addDays(wb, -(N-1));
  }else{
    // vista completa: la ventana es un tramo de [d0, d1] que se puede achicar con el zoom
    if(zoomDays == null || zoomDays >= fullSpan){ zoomDays = fullSpan; zoomStart = 0; }
    zoomDays  = Math.max(7, Math.min(fullSpan, Math.round(zoomDays)));
    zoomStart = Math.max(0, Math.min(fullSpan - zoomDays, Math.round(zoomStart)));
    wa = addDays(d0, zoomStart);
    wb = addDays(wa, zoomDays);
  }
  const spanD = Math.max(1, diffDays(wa, wb));
  const puedeAtras = diffDays(d0, wa) > 0;
  const conZoom = !N && zoomDays < fullSpan;

  // sin recortar el valor: lo que se sale del área de dibujo lo corta el clipPath
  const X = k => PL + iw * (diffDays(wa,k) / spanD);

  // saldo con el que se entra a la ventana + puntos que caen adentro
  let saldoEntrada = 0, hayPrevios = false;
  serie.forEach(([k,v]) => { if(k < wa){ saldoEntrada = v; hayPrevios = true; } });
  const visibles = serie.filter(([k]) => k >= wa && k <= wb);

  // Escala vertical. La banda visible arranca en 0 y mide yAuto, pero el arrastre
  // vertical la puede correr con yShift, así te podés mover en las dos direcciones.
  const maxVis = Math.max(saldoEntrada, 0, ...visibles.map(([,v]) => v));
  const yAuto = ((N || conZoom) ? Math.max(maxVis, 1) : Math.max(c.total, maxVis, 1)) * 1.12;
  yShift = Math.max(-yAuto*0.4, Math.min(yAuto*1.2, yShift));
  chartYAuto = yAuto;

  const yLo = yShift, yHi = yAuto + yShift;
  const Y = v => PT + ih * (1 - (v - yLo) / (yHi - yLo));

  const y0 = Y(0);
  const rp = spanD > 90 ? 2.8 : 3.8;   // radio del punto

  const puntos = visibles.map(([k,v]) =>
    `<circle cx="${X(k).toFixed(1)}" cy="${Y(Math.max(0,v)).toFixed(1)}" r="${rp}" `
    + `fill="var(--acc)" stroke="var(--card)" stroke-width="1.6"><title>${fmtDate(k)} · ${usd(v)} USD</title></circle>`
  ).join('');

  // --- línea que une los puntos
  const lp = [];
  if(hayPrevios) lp.push([wa, saldoEntrada]);
  visibles.forEach(([k,v]) => lp.push([k, Math.max(0,v)]));
  if(lp.length){
    const ultK = lp[lp.length-1][0], ultV = lp[lp.length-1][1];
    const finK = diffDays(c.hoy, wb) > 0 ? c.hoy : wb;   // la línea real no pasa de hoy
    if(diffDays(ultK, finK) > 0) lp.push([finK, ultV]);
  }
  const lineaD = lp.length
    ? 'M ' + lp.map(([k,v]) => `${X(k).toFixed(1)} ${Y(v).toFixed(1)}`).join(' L ')
    : '';

  // --- área bajo la curva: la misma línea, cerrada contra el cero.
  // Si por el arrastre el cero queda fuera de pantalla, el clipPath lo corta y
  // el relleno llega hasta el borde de abajo.
  const areaD = lp.length > 1
    ? `M ${X(lp[0][0]).toFixed(1)} ${y0.toFixed(1)} `
      + 'L ' + lp.map(([k,v]) => `${X(k).toFixed(1)} ${Y(v).toFixed(1)}`).join(' L ')
      + ` L ${X(lp[lp.length-1][0]).toFixed(1)} ${y0.toFixed(1)} Z`
    : '';

  // --- plan ideal, evaluado en los bordes de la ventana
  const planAt = k => c.saldoInicial
    + c.planDia * Math.min(c.planTotalDias, Math.max(0, diffDays(o.startDate, k)));
  const planD = `M ${X(wa).toFixed(1)} ${Y(planAt(wa)).toFixed(1)} `
              + `L ${X(wb).toFixed(1)} ${Y(planAt(wb)).toFixed(1)}`;

  // --- proyección: solo tiene sentido en la vista completa
  let projD = '';
  if(!N && c.fechaEstim && c.fechaEstim !== 'cumplido'){
    projD = `M ${X(c.hoy).toFixed(1)} ${Y(c.saldo).toFixed(1)} `
          + `L ${X(c.fechaEstim).toFixed(1)} ${Y(c.total).toFixed(1)}`;
  }

  // --- grillas
  let gy = '';
  for(let i = 0; i <= 4; i++){
    const v = yLo + (yHi-yLo)*i/4, y = Y(v);
    gy += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>
           <text x="${PL-10}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--dim)">${usd0(v)}</text>`;
  }

  // una raya por día cuando entran; etiquetas cada tanto para que no se pisen
  const paso = Math.max(1, Math.ceil(spanD/6));
  let gx = '';
  if(spanD <= 45){
    for(let i = 0; i <= spanD; i++){
      const x = X(addDays(wa,i));
      gx += `<line x1="${x.toFixed(1)}" y1="${PT}" x2="${x.toFixed(1)}" y2="${(PT+ih).toFixed(1)}"
                   stroke="var(--line-soft)" stroke-width="1" opacity="${i%paso===0?'1':'.45'}"/>`;
    }
  }
  for(let i = 0; i <= spanD; i += paso){
    const k = addDays(wa,i), x = X(k);
    if(spanD > 45){
      gx += `<line x1="${x.toFixed(1)}" y1="${PT}" x2="${x.toFixed(1)}" y2="${(PT+ih).toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`;
    }
    gx += `<text x="${x.toFixed(1)}" y="${H-26}" text-anchor="middle" font-size="11" fill="var(--dim)">${fmtShort(k)}</text>`;
  }

  // --- marcas
  const dentro = k => diffDays(wa,k) >= 0 && diffDays(k,wb) >= 0;
  const yObj = Y(c.total);
  const verObj = c.total > 0 && c.total >= yLo && c.total <= yHi;

  // datos que necesitan la rueda y el arrastre para orientarse
  chartAnchorDia = diffDays(d0, c.hoy);

  const marcaHoy = dentro(c.hoy) ? `
    <line x1="${X(c.hoy).toFixed(1)}" y1="${PT}" x2="${X(c.hoy).toFixed(1)}" y2="${(PT+ih).toFixed(1)}" stroke="var(--muted)" stroke-width="1" opacity=".45"/>
    <text x="${(X(c.hoy)+4).toFixed(1)}" y="${PT+11}" font-size="10" fill="var(--muted)">hoy</text>` : '';

  const marcaMeta = dentro(o.targetDate) ? `
    <line x1="${X(o.targetDate).toFixed(1)}" y1="${PT}" x2="${X(o.targetDate).toFixed(1)}" y2="${(PT+ih).toFixed(1)}"
          stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="3 4" opacity=".55"/>` : '';

  const marcaObj = verObj ? `
    <line x1="${PL}" y1="${yObj.toFixed(1)}" x2="${W-PR}" y2="${yObj.toFixed(1)}" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="4 4"/>
    <text x="${W-PR}" y="${(yObj-8).toFixed(1)}" text-anchor="end" font-size="11" font-weight="600" fill="var(--warn)">objetivo ${usd0(c.total)} USD · ${fmtShort(o.targetDate)}</text>` : '';

  const rotulo = `${fmtDate(wa)} – ${fmtDate(wb)}`;

  return `<div class="card">
    <div class="card-h">
      <h2>${ico('chart')} Plan vs. lo que llevás</h2>
      <div class="spacer"></div>
      ${N ? `<button class="btn sm ghost" data-shift="back" ${puedeAtras?'':'disabled'} title="Ventana anterior">‹</button>` : ''}
      <span class="chip num">${rotulo}</span>
      ${N ? `<button class="btn sm ghost" data-shift="fwd" ${chartOffset>0?'':'disabled'} title="Ventana siguiente">›</button>` : ''}
      ${!N ? `<button class="btn sm ghost" data-zoom="out" ${conZoom?'':'disabled'} title="Alejar">−</button>
              <button class="btn sm ghost" data-zoom="in" ${zoomDays<=7?'disabled':''} title="Acercar">+</button>` : ''}
      ${(conZoom || Math.abs(yShift) > 0.5) ? `<button class="btn sm ghost" data-zoom="reset" title="Volver a la vista completa">⟲</button>` : ''}
      <div class="seg" style="flex:none">
        <button type="button" class="${chartRange==='sem'?'on':''}" data-range="sem">Semana</button>
        <button type="button" class="${chartRange==='mes'?'on':''}" data-range="mes">Mes</button>
        <button type="button" class="${chartRange==='todo'?'on':''}" data-range="todo">Todo</button>
      </div>
    </div>
    <div class="card-b">
      <div class="chart-wrap">
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ahorro acumulado en dólares por día">
        <defs>
          <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--acc)" stop-opacity=".34"/>
            <stop offset="1" stop-color="var(--acc)" stop-opacity=".02"/>
          </linearGradient>
          <clipPath id="cp"><rect x="${PL}" y="${PT}" width="${iw}" height="${ih}"/></clipPath>
        </defs>
        ${gy}${gx}
        ${marcaHoy}${marcaMeta}
        <g clip-path="url(#cp)">
          ${areaD ? `<path d="${areaD}" fill="url(#ga)" stroke="none"/>` : ''}
          <path d="${planD}" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="6 5" opacity=".75"/>
          ${lineaD ? `<path d="${lineaD}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
          ${puntos}
          ${projD ? `<path d="${projD}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="5 5" opacity=".9"/>
            <circle cx="${X(c.fechaEstim).toFixed(1)}" cy="${Y(c.total).toFixed(1)}" r="4.5" fill="var(--blue)"/>` : ''}
        </g>
        ${marcaObj}
        ${!visibles.length && !hayPrevios ? `<text x="${(PL+iw/2).toFixed(1)}" y="${(PT+ih/2).toFixed(1)}" text-anchor="middle" font-size="13" fill="var(--dim)">Sin movimientos en este rango</text>` : ''}
        <text x="${(PL+iw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--dim)">días →</text>
        <text transform="translate(15,${(PT+ih/2).toFixed(1)}) rotate(-90)" text-anchor="middle" font-size="10.5" fill="var(--dim)">USD ahorrados</text>
      </svg>
      </div>
      <div class="lg">
        <span><i style="background:var(--acc)"></i> Tu ahorro acumulado</span>
        <span><i style="background:var(--muted)"></i> Plan ideal</span>
        ${projD ? '<span><i style="background:var(--blue)"></i> Proyección a tu ritmo</span>' : ''}
        ${verObj ? '<span><i style="background:var(--warn)"></i> Objetivo y fecha meta</span>' : ''}
        ${(N || conZoom) ? '<span style="color:var(--dim)">Escala ajustada al rango visible</span>' : ''}
        <span style="color:var(--dim)">${!N ? 'Rueda para hacer zoom · ' : ''}arrastrá para moverte en cualquier dirección</span>
      </div>
    </div>
  </div>`;
}

/** Redibuja solo la tarjeta del gráfico. El zoom se usa a 60fps y no hace falta
    rehacer toda la pantalla en cada movimiento. */
function repaintChart(){
  const o = activeObj(), box = document.getElementById('chartBox');
  if(!o || !box) return;
  const c = compute(o);
  box.innerHTML = chartHTML(o,c);
  wireChart();
}

/** Acerca o aleja manteniendo quieto el día que está bajo `frac` (0 = borde izq, 1 = der) */
function zoomAlrededor(frac, factor){
  const nuevo = Math.max(7, Math.min(chartFullSpan, Math.round(zoomDays * factor)));
  const diaFijo = zoomStart + frac * zoomDays;
  zoomStart = Math.round(diaFijo - frac * nuevo);
  zoomDays  = nuevo;
}

/**
 * Dónde clavar el zoom. Si la punta del gráfico (hoy) está a la vista, se ancla ahí:
 * es donde están tus datos, así que al acercarte no se te escapa de la pantalla.
 * Si te fuiste a mirar otra época, se ancla en el medio de lo que estás viendo.
 */
function anclaZoom(){
  const fin = zoomStart + zoomDays;
  if(chartAnchorDia >= zoomStart && chartAnchorDia <= fin){
    return (chartAnchorDia - zoomStart) / zoomDays;
  }
  return 0.5;
}

function wireChart(){
  document.querySelectorAll('[data-range]').forEach(b => b.onclick = () => {
    chartRange = b.dataset.range;
    chartOffset = 0; zoomDays = null; zoomStart = 0; yShift = 0;
    repaintChart();
  });
  document.querySelectorAll('[data-shift]').forEach(b => b.onclick = () => {
    chartOffset = Math.max(0, chartOffset + (b.dataset.shift === 'back' ? 1 : -1));
    repaintChart();
  });
  document.querySelectorAll('[data-zoom]').forEach(b => b.onclick = () => {
    if(b.dataset.zoom === 'reset'){ zoomDays = chartFullSpan; zoomStart = 0; yShift = 0; }
    else zoomAlrededor(anclaZoom(), b.dataset.zoom === 'in' ? 0.75 : 1/0.75);
    repaintChart();
  });

  const svg = document.querySelector('svg.chart');
  if(!svg) return;
  svg.style.cursor = 'grab';

  // --- rueda: zoom fino. Un click de rueda mueve ~8%, no un salto.
  if(chartRange === 'todo'){
    svg.addEventListener('wheel', e => {
      e.preventDefault();
      const paso = Math.max(-1.5, Math.min(1.5, e.deltaY / 100));   // trackpad incluido
      zoomAlrededor(anclaZoom(), Math.exp(paso * 0.08));
      repaintChart();
    }, { passive: false });
  }

  // --- arrastre libre: horizontal (si hay zoom) y vertical siempre
  svg.addEventListener('mousedown', e => {
    e.preventDefault();
    const x0 = e.clientX, y0 = e.clientY;
    const baseX = zoomStart, baseY = yShift;
    const puedeX = chartRange === 'todo' && zoomDays != null && zoomDays < chartFullSpan;
    let ultX = x0, ultY = y0, pendiente = false;
    svg.style.cursor = 'grabbing';

    const mover = ev => {
      ultX = ev.clientX; ultY = ev.clientY;
      if(pendiente) return;
      pendiente = true;
      requestAnimationFrame(() => {
        pendiente = false;
        const el = document.querySelector('svg.chart');
        if(!el) return;
        const r = el.getBoundingClientRect();
        if(puedeX){
          const pxPorDia = (r.width * (CIW/CW)) / zoomDays;
          zoomStart = Math.round(baseX - (ultX - x0) / pxPorDia);
        }
        const usdPorPx = chartYAuto / (r.height * (CIH/CH));
        yShift = baseY + (ultY - y0) * usdPorPx;
        repaintChart();
        const nuevo = document.querySelector('svg.chart');
        if(nuevo) nuevo.style.cursor = 'grabbing';
      });
    };
    const soltar = () => {
      window.removeEventListener('mousemove', mover);
      window.removeEventListener('mouseup', soltar);
      const el = document.querySelector('svg.chart');
      if(el) el.style.cursor = 'grab';
    };
    window.addEventListener('mousemove', mover);
    window.addEventListener('mouseup', soltar);
  });
}

/* ---- simulador ---- */
let simA = null, simB = null;   // se conservan entre renders

function simHTML(o,c){
  if(simA == null) simA = c.reqDia !== Infinity && c.reqDia > 0 ? Math.round(c.reqDia*100)/100 : 5;
  if(simB == null) simB = o.targetDate;

  return `<div class="card">
    <div class="card-h"><h2>${ico('spark')} ¿Qué pasa si…?</h2></div>
    <div class="card-b">
      <div class="row">
        <div class="f"><label>Si meto por día (USD)</label>
          <input id="simA" type="number" step="0.01" min="0" value="${simA}"></div>
      </div>
      <div class="sim-out" id="simOutA"></div>
      <div class="sep"></div>
      <div class="row">
        <div class="f"><label>Si quiero llegar el</label>
          <input id="simB" type="date" value="${simB}"></div>
      </div>
      <div class="sim-out" id="simOutB"></div>
      <div class="hint" style="margin-top:10px">Esto no toca tus datos, es solo para probar escenarios.</div>
    </div>
  </div>`;
}

function renderSim(o,c){
  const a = document.getElementById('simOutA');
  const b = document.getElementById('simOutB');
  if(!a || !b || !o || !c) return;
  if(simB == null) simB = o.targetDate;   // sin fecha elegida no hay nada que comparar

  // A: monto por día -> fecha
  const v = Number(simA);
  if(c.falta <= 0.0001){
    a.innerHTML = 'Ya llegaste al objetivo.';
  }else if(!v || v <= 0){
    a.innerHTML = 'Con 0 por día no llegás nunca.';
  }else{
    const dias = Math.ceil(c.falta / v);
    const f = addDays(c.hoy, dias);
    const dif = diffDays(f, o.targetDate);
    a.innerHTML = `Metiendo <b>${usd(v)} USD por día</b> (${usd(v*7)} por semana${ars(v)?', '+ars(v)+' diarios':''}) llegás el
      <span class="big">${fmtLong(f)}</span>
      <span style="color:var(--muted);font-size:13px">en ${humanDays(dias)} · ` +
      (dif > 0 ? `<b style="color:var(--acc)">${humanDays(dif)} antes</b> de tu meta`
       : dif === 0 ? `<b style="color:var(--acc)">justo en tu meta</b>`
       : `<b style="color:var(--bad)">${humanDays(-dif)} después</b> de tu meta`) + `</span>`;
  }

  // B: fecha -> monto por día
  const dd = diffDays(c.hoy, simB);
  if(c.falta <= 0.0001){
    b.innerHTML = 'Ya llegaste al objetivo.';
  }else if(dd <= 0){
    b.innerHTML = 'Elegí una fecha posterior a hoy.';
  }else{
    const need = c.falta / dd;
    const vs = c.ritmoDia != null
      ? (c.ritmoDia >= need
          ? ` Tu ritmo actual (${usd(c.ritmoDia)}/día) ya alcanza.`
          : ` Tu ritmo actual es ${usd(c.ritmoDia)}/día: tenés que subir ${usd(need-c.ritmoDia)} por día.`)
      : '';
    b.innerHTML = `Para llegar el <b>${fmtLong(simB)}</b> (${humanDays(dd)}) necesitás
      <span class="big">${usd(need)} USD por día</span>
      <span style="color:var(--muted);font-size:13px">${usd(need*7)} por semana${ars(need)?' · '+ars(need)+' diarios':''}.${vs}</span>`;
  }
}

/* ---- fechas de oportunidad ---- */

      <div class="v">${f.alcanza

/* ---- ajustes del objetivo ---- */
function settingsHTML(o,c){
  return `<div class="card">
    <div class="card-h"><h2>${ico('gear')} Ajustes de este objetivo</h2></div>
    <div class="card-b">
      <div class="stack">
        <div class="f"><label>Nombre</label><input id="setName" value="${esc(o.name)}" maxlength="60"></div>
        <div class="row">
          <div class="f"><label>Fecha meta</label><input id="setDate" type="date" value="${o.targetDate}"></div>
          <div class="f"><label>Arrancó el</label><input id="setStart" type="date" value="${o.startDate}"></div>
        </div>
        <div class="hint">«Arrancó el» es desde cuándo se traza la línea del plan ideal. Cambialo si empezaste a ahorrar antes de crear el objetivo.</div>
      </div>
      <div class="sep"></div>
      <div class="stack">
        <label class="check"><input type="checkbox" id="setRecOn" ${o.recurrente&&o.recurrente.activo?'checked':''}>
          Destino parte del sueldo a este objetivo todos los meses</label>
        <div class="row" id="setRecBox" style="${o.recurrente&&o.recurrente.activo?'':'display:none'}">
          <div class="f xs"><label>Día del mes</label>
            <input id="setRecDia" type="number" min="1" max="31" value="${o.recurrente?o.recurrente.dia:5}"></div>
          <div class="f"><label>Monto USD</label>
            <input id="setRecMonto" type="number" step="0.01" min="0" value="${o.recurrente?o.recurrente.monto:''}" placeholder="50"></div>
        </div>
        <div class="hint">Ese aporte queda <b>fuera del promedio semanal</b> a propósito: como ya
          está previsto, el ritmo mide solo lo que ahorrás de más. La proyección suma las dos cosas.</div>
      </div>
      <div class="sep"></div>
      <div class="row">
        <button class="btn" id="btnArch">${o.archived?'Desarchivar':'Archivar'} objetivo</button>
        <div class="spacer"></div>
        <button class="btn danger ghost" id="btnDelObj">Borrar objetivo</button>
      </div>
      <div class="warnbox" style="margin-top:14px">
        Los datos se guardan solo en este navegador. Si limpiás la caché sin haber hecho
        <b>Backup</b>, se pierde todo el historial.
      </div>
    </div>
  </div>`;
}

/* ============================================================
   9. EVENTOS
   ============================================================ */
function wire(o,c){
  const $ = s => document.querySelector(s);

  /* -- ítems -- */
  const fItem = $('#fItem');
  const hint  = $('#curHint');
  const HINT_BASE = 'Se llenan en cascada: primero el de arriba al 100%, después el siguiente. '
                  + 'Ordenalos con ▲▼. Meté el envío y los impuestos dentro del precio.';

  /** Muestra en vivo a cuántos dólares equivale lo que estás tipeando */
  function updHint(){
    if(!hint || !fItem) return;
    const v = Number(fItem.price.value);
    const r = state.settings.rate.value;
    if(itemCur !== 'ars'){ hint.innerHTML = HINT_BASE; return; }
    if(!r){
      hint.innerHTML = '<span style="color:var(--warn)">Para cargar en pesos necesito la cotización. '
                     + 'Tocá el chip <b>USD</b> de arriba a la derecha y buscala o escribila a mano.</span>';
      return;
    }
    if(!isFinite(v) || v <= 0){
      hint.innerHTML = 'Escribí el precio en pesos y te lo paso a dólares con el dólar del BNA ($'
                     + nfARS.format(Math.round(r)) + ').';
      return;
    }
    hint.innerHTML = '$' + nfARS.format(Math.round(v)) + ' ÷ ' + nfARS.format(Math.round(r))
                   + ' = <b style="color:var(--acc)">' + usd(v/r) + ' USD</b>. '
                   + 'Se guarda en dólares, así que si el dólar cambia el ítem no se mueve.';
  }

  document.querySelectorAll('[data-cur]').forEach(b => b.onclick = () => {
    itemCur = b.dataset.cur;
    document.querySelectorAll('[data-cur]').forEach(x => x.className = x.dataset.cur === itemCur ? 'on' : '');
    fItem.price.placeholder = itemCur === 'ars' ? '760000' : '500';
    updHint(); fItem.price.focus();
  });
  if(fItem) fItem.price.oninput = updHint;
  updHint();

  if(fItem) fItem.onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(fItem);
    const name = String(fd.get('name')||'').trim();
    const raw  = Number(fd.get('price'));
    if(!name || !isFinite(raw) || raw < 0) return;
    const price = aUSD(raw, itemCur);
    if(price == null){
      alert('Para cargar precios en pesos necesito la cotización del dólar.\n\n'
          + 'Tocá el chip "USD" de arriba a la derecha, buscala o escribila a mano, y volvé a intentar.');
      return;
    }
    const maxOrder = o.items.reduce((m,i) => Math.max(m, i.order), -1);
    o.items.push({ id: uid(), name, price, order: maxOrder+1, bought:false, boughtDate:null });
    save(); renderTabs(); render();
  };

  document.querySelectorAll('[data-up]').forEach(b => b.onclick = () => moveItem(o, b.dataset.up, -1));
  document.querySelectorAll('[data-down]').forEach(b => b.onclick = () => moveItem(o, b.dataset.down, 1));

  document.querySelectorAll('[data-del-item]').forEach(b => b.onclick = () => {
    const it = o.items.find(i => i.id === b.dataset.delItem);
    if(!it) return;
    if(!confirm('¿Borrar «'+it.name+'» del objetivo?\n\nEl total se recalcula, pero tus movimientos no se tocan.')) return;
    o.items = o.items.filter(i => i.id !== it.id);
    save(); renderTabs(); render();
  });

  document.querySelectorAll('[data-edit-item]').forEach(b => b.onclick = () => {
    const it = o.items.find(i => i.id === b.dataset.editItem);
    if(!it) return;
    let cur = 'usd';
    modal('Editar ítem', `<div class="stack">
        <div class="f"><label>Nombre</label><input id="eiName" value="${esc(it.name)}" maxlength="60"></div>
        <div class="row">
          <div class="f"><label>Precio</label>
            <input id="eiPrice" type="number" step="0.01" min="0" value="${it.price.toFixed(2)}"></div>
          <div class="f" style="flex:0 0 142px"><label>Moneda</label>
            <div class="seg">
              <button type="button" class="on" data-ecur="usd">USD</button>
              <button type="button" data-ecur="ars">Pesos</button>
            </div>
          </div>
        </div>
        <div class="hint" id="eiHint">Si el precio cambió, actualizalo acá y todos los números se recalculan solos.</div>
      </div>`,
      [{label:'Cancelar', onClick: closeModal},
       {label:'Guardar', cls:'primary', onClick: () => {
          const n = document.getElementById('eiName').value.trim();
          const raw = Number(document.getElementById('eiPrice').value);
          if(!n || !isFinite(raw) || raw < 0) return;
          const p = aUSD(raw, cur);
          if(p == null){ alert('Necesito la cotización del dólar para convertir desde pesos.'); return; }
          it.name = n; it.price = p;
          save(); closeModal(); renderTabs(); render();
       }}],
      () => {
        const inp = document.getElementById('eiPrice');
        const eh  = document.getElementById('eiHint');
        const upd = () => {
          const r = state.settings.rate.value, v = Number(inp.value);
          if(cur !== 'ars'){ eh.textContent = 'Si el precio cambió, actualizalo acá y todos los números se recalculan solos.'; return; }
          if(!r){ eh.innerHTML = '<span style="color:var(--warn)">Falta la cotización del dólar.</span>'; return; }
          eh.innerHTML = isFinite(v) && v > 0
            ? '$'+nfARS.format(Math.round(v))+' ÷ '+nfARS.format(Math.round(r))
              +' = <b style="color:var(--acc)">'+usd(v/r)+' USD</b>'
            : 'Escribí el precio en pesos y lo paso a dólares.';
        };
        document.querySelectorAll('[data-ecur]').forEach(b => b.onclick = () => {
          const prev = cur;
          cur = b.dataset.ecur;
          document.querySelectorAll('[data-ecur]').forEach(x => x.className = x.dataset.ecur === cur ? 'on' : '');
          // pasamos el valor que ya está escrito a la moneda nueva, para no tener que retipearlo
          const r = state.settings.rate.value, v = Number(inp.value);
          if(r && isFinite(v) && v > 0 && prev !== cur){
            inp.value = cur === 'ars' ? Math.round(v*r) : (v/r).toFixed(2);
          }
          upd(); inp.focus();
        });
        inp.oninput = upd;
        document.getElementById('eiName').focus();
      });
  });

  document.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const it = o.items.find(i => i.id === b.dataset.buy);
    if(!it) return;
    if(!confirm('¿Marcar «'+it.name+'» como comprado?\n\nSe van a descontar '+usd(it.price)+
                ' USD de tu ahorro y el ítem sale del total pendiente.')) return;
    it.bought = true;
    it.boughtDate = today();
    o.movements.push({ id: uid(), date: today(), amount: -it.price,
      note: 'Compra: '+it.name, cat: 'Compra', excludeFromRate: true, itemId: it.id });
    save(); renderTabs(); render();
  });

  document.querySelectorAll('[data-unbuy]').forEach(b => b.onclick = () => {
    const it = o.items.find(i => i.id === b.dataset.unbuy);
    if(!it) return;
    if(!confirm('¿Deshacer la compra de «'+it.name+'»?\n\nVuelve al total pendiente y se devuelven los '+
                usd(it.price)+' USD al ahorro.')) return;
    it.bought = false; it.boughtDate = null;
    o.movements = o.movements.filter(m => m.itemId !== it.id);
    save(); renderTabs(); render();
  });

  /* -- carga de plata: abre el modal del número grande -- */
  if($('#qAdd')) $('#qAdd').onclick = () => montoModal(1);
  if($('#qSub')) $('#qSub').onclick = () => montoModal(-1);

  /* -- carga rápida (quedó sin campo inline; se mantiene por compatibilidad) -- */
  const qA = $('#qAmount'), qC = $('#qCat'), qF = $('#qFlash');

  /** Agrega un movimiento con la fecha de hoy y avisa cuántos días te movió */
  function cargaRapida(signo){
    const v = Number(qA.value);
    if(!isFinite(v) || v <= 0){ qA.focus(); return; }
    const monto = signo * v;
    const dd = diasQueMueve(monto, c);   // congelada acá: la historia no se reescribe
    o.movements.push({ id: uid(), date: today(), amount: monto,
      note: '', cat: signo > 0 ? qC.value : 'Gasto', excludeFromRate: false,
      itemId: null, recYm: null, diasPlan: dd });
    save();
    qA.value = '';
    renderTabs(); render();

    const f = document.getElementById('qFlash');
    if(f){
      f.textContent = dd
        ? (dd > 0 ? `+${usd(v)} · te adelantaste ${dd} día${dd===1?'':'s'}`
                  : `−${usd(v)} · te atrasaste ${Math.abs(dd)} día${Math.abs(dd)===1?'':'s'}`)
        : (signo > 0 ? `+${usd(v)} cargado` : `−${usd(v)} cargado`);
      f.style.color = signo > 0 ? 'var(--acc)' : 'var(--bad)';
      requestAnimationFrame(() => f.classList.add('on'));
      setTimeout(() => { const g = document.getElementById('qFlash'); if(g) g.classList.remove('on'); }, 3200);
    }
    const nuevo = document.getElementById('qAmount');
    if(nuevo) nuevo.focus();
  }

  if(qA) qA.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); cargaRapida(1); } };

  /* -- sueldo pendiente: es global y se reparte entre los objetivos por porcentaje -- */
  document.querySelectorAll('[data-pend-ok]').forEach(b => b.onclick = () => {
    const ym = b.dataset.pendOk;
    const inp = $('#pendMonto');
    const monto = Math.max(0, Number(inp && inp.value) || 0);
    const conPct = state.objectives.filter(x => (x.pctSueldo||0) > 0);
    if(!conPct.length){
      alert('Antes de confirmar tenés que repartir el sueldo.\n\n'
          + 'Abrí el menú de las tres barritas y asignale un porcentaje a cada objetivo.');
      return;
    }
    const fecha = diaDelMes(ym, state.settings.sueldo.dia);
    conPct.forEach(x => {
      const parte = monto * x.pctSueldo / 100;
      if(parte <= 0) return;
      // recYm identifica con certeza que salió de confirmar un sueldo: si después
      // borrás el movimiento, ese mes vuelve a quedar pendiente.
      x.movements.push({ id: uid(), date: fecha, amount: parte, note: 'Sueldo',
        cat: 'Sueldo', excludeFromRate: true, itemId: null, recYm: ym, diasPlan: null });
    });
    state.settings.sueldo.hechos.push(ym);
    save(); renderTabs(); render();
  });
  document.querySelectorAll('[data-pend-skip]').forEach(b => b.onclick = () => {
    state.settings.sueldo.hechos.push(b.dataset.pendSkip);
    save(); renderTabs(); render();
  });

  /* -- movimientos -- */
  let kind = 'in';
  document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => {
    kind = b.dataset.kind;
    document.querySelectorAll('[data-kind]').forEach(x => {
      x.className = x.dataset.kind === kind ? ('on '+kind) : '';
    });
    const sel = $('#mvCat');
    if(sel) sel.innerHTML = (kind === 'in' ? CATS_IN : CATS_OUT).map(x => `<option>${x}</option>`).join('');
  });

  const fMov = $('#fMov');
  if(fMov) fMov.onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(fMov);
    const date = String(fd.get('date')||'');
    let amount = Number(fd.get('amount'));
    if(!date || !isFinite(amount) || amount <= 0) return;
    if(date > today()){
      alert('La fecha es futura.\n\nLos movimientos se cargan cuando pasan de verdad. '
          + 'Para plata programada usá el sueldo recurrente, en los ajustes del objetivo.');
      return;
    }
    if(kind === 'out') amount = -amount;
    const excl = fd.get('excl') === 'on';
    o.movements.push({
      id: uid(), date, amount,
      note: String(fd.get('note')||'').trim(),
      cat: String(fd.get('cat')||''),
      excludeFromRate: excl,
      itemId: null, recYm: null,
      // congelada acá; los excluidos (ahorro previo) no llevan etiqueta: son plata prevista
      diasPlan: excl ? null : diasQueMueve(amount, c)
    });
    save(); renderTabs(); render();
  };

  document.querySelectorAll('[data-del-mov]').forEach(b => b.onclick = () => {
    const m = o.movements.find(x => x.id === b.dataset.delMov);
    if(!m) return;
    if(m.itemId){
      alert('Este movimiento salió de marcar un ítem como comprado.\n\nPara borrarlo, deshacé la compra desde el ítem.');
      return;
    }
    const esSueldo = m.recYm && o.recurrente;
    if(!confirm('¿Borrar este movimiento de '+usd(Math.abs(m.amount))+' USD?'
      + (esSueldo ? '\n\nEs un sueldo confirmado: el mes va a volver a aparecer como pendiente.' : ''))) return;
    if(esSueldo){
      // sin esto, el mes queda marcado como hecho y la plata desaparece para siempre
      o.recurrente.hechos = o.recurrente.hechos.filter(x => x !== m.recYm);
    }
    o.movements = o.movements.filter(x => x.id !== m.id);
    save(); renderTabs(); render();
  });

  /* -- gráfico: rango, navegación y zoom -- */
  wireChart();

  /* -- el simulador vive en el panel lateral; acá no hay nada que cablear -- */

  /* -- ajustes -- */
  const nm = $('#setName');
  if(nm) nm.onchange = () => {
    const v = nm.value.trim();
    if(v){ o.name = v; save(); renderTabs(); }
  };
  const sd = $('#setDate');
  if(sd) sd.onchange = () => {
    if(!sd.value) return;
    if(sd.value <= o.startDate){
      // con meta <= arranque el plan lineal colapsa a un día y muestra cualquier cosa
      alert('La fecha meta tiene que ser posterior al arranque ('+fmtDate(o.startDate)+').');
      sd.value = o.targetDate;
      return;
    }
    o.targetDate = sd.value; save(); renderTabs(); render();
  };
  const ss = $('#setStart');
  if(ss) ss.onchange = () => {
    if(!ss.value) return;
    if(ss.value >= o.targetDate){
      alert('El arranque tiene que ser anterior a la fecha meta ('+fmtDate(o.targetDate)+').');
      ss.value = o.startDate;
      return;
    }
    o.startDate = ss.value; save(); render();
  };

  /* -- sueldo recurrente -- */
  const rOn = $('#setRecOn');

  // Marca como hechos los meses cuyo cobro ya venció. Se usa al apagar el recurrente
  // y al volver a prenderlo: los meses del período apagado no deben caer todos juntos
  // como pendientes.
  const saltearVencidos = (rec) => {
    let ym = rec.desde;
    const lim = mesDe(today());
    while(ym <= lim){
      if(diaDelMes(ym, rec.dia) < today() && !rec.hechos.includes(ym)) rec.hechos.push(ym);
      ym = addMes(ym, 1);
    }
  };

  const guardarRec = () => {
    if(!rOn.checked){
      if(o.recurrente){
        saltearVencidos(o.recurrente);
        o.recurrente.activo = false;
      }
      save(); renderTabs(); render(); return;
    }
    const dia = Math.max(1, Math.min(31, Number($('#setRecDia').value) || 1));
    const monto = Number($('#setRecMonto').value) || 0;
    const prev = o.recurrente;
    const reactivando = !!(prev && prev.activo === false);
    o.recurrente = {
      dia, monto, activo: true,
      desde: (prev && prev.desde) || mesDesdeRec(dia),
      hechos: (prev && prev.hechos) || []
    };
    // Solo al reactivar: editar el día o el monto con el recurrente prendido no debe
    // tragarse un mes que estaba legítimamente pendiente.
    if(reactivando) saltearVencidos(o.recurrente);
    save(); renderTabs(); render();
  };
  if(rOn){
    rOn.onchange = () => {
      const box = $('#setRecBox');
      if(box) box.style.display = rOn.checked ? '' : 'none';
      if(!rOn.checked) guardarRec();
    };
    const rd = $('#setRecDia'), rm = $('#setRecMonto');
    if(rd) rd.onchange = guardarRec;
    if(rm) rm.onchange = guardarRec;
  }

  const ba = $('#btnArch');
  if(ba) ba.onclick = () => {
    o.archived = !o.archived;
    if(o.archived){
      const next = state.objectives.find(x => !x.archived);
      state.activeId = next ? next.id : o.id;
      showArchived = !next;
    }
    save(); renderTabs(); render();
  };

  const bd = $('#btnDelObj');
  if(bd) bd.onclick = () => {
    if(!confirm('¿Borrar el objetivo «'+o.name+'» con todos sus ítems y movimientos?\n\nEsto no se puede deshacer.')) return;
    state.objectives = state.objectives.filter(x => x.id !== o.id);
    const next = state.objectives.find(x => !x.archived) || state.objectives[0];
    state.activeId = next ? next.id : null;
    save(); renderTabs(); render();
  };
}

function moveItem(o, id, dir){
  const list = o.items.filter(i => !i.bought).sort((a,b) => a.order - b.order);
  const idx = list.findIndex(i => i.id === id);
  if(idx < 0) return;
  const j = idx + dir;
  if(j < 0 || j >= list.length) return;
  const tmp = list[idx].order;
  list[idx].order = list[j].order;
  list[j].order = tmp;
  save(); render();
}

/* ============================================================
   10. MODAL DE OBJETIVO (crear)

function objModal(){

  modal('Nuevo objetivo', `<div class="stack">
      <div class="f"><label>Nombre del objetivo</label>
        <input id="noName" placeholder="Ej: Upgrade PC" maxlength="60"></div>
      <div class="f"><label>Fecha meta</label>
        <input id="noDate" type="date" value="${def}"></div>
      <div class="f"><label>Ahorro que ya tenés para esto (USD, opcional)</label>
        <input id="noSaldo" type="number" step="0.01" min="0" placeholder="0"></div>
      <div class="hint">Ese ahorro previo se carga como primer movimiento y no se cuenta
        en el promedio semanal, para que la proyección no te quede inflada.
        Los ítems que querés comprar los agregás después, adentro del objetivo.</div>
      <div class="sep"></div>
      <div class="row">
        <div class="f xs"><label>Cobrás el día</label>
          <input id="noDia" type="number" min="1" max="31" placeholder="5"></div>
        <div class="f"><label>De eso destinás a este pozo (USD)</label>
          <input id="noRec" type="number" step="0.01" min="0" placeholder="50"></div>
      </div>
      <div class="hint">Opcional. Cada mes, ese día, te va a aparecer arriba un aviso para
        confirmarlo con un click. No se carga solo: si un mes no lo ahorraste, lo salteás y listo.</div>
    </div>`,
    [{label:'Cancelar', onClick: closeModal},
     {label:'Crear objetivo', cls:'primary', onClick: () => {
        const name = document.getElementById('noName').value.trim() || 'Objetivo';
        const date = document.getElementById('noDate').value || def;
        const ini  = Number(document.getElementById('noSaldo').value) || 0;
        const dia  = Number(document.getElementById('noDia').value) || 0;
        const mrec = Number(document.getElementById('noRec').value) || 0;
        if(date <= today()){
          alert('La fecha meta tiene que ser posterior a hoy.');
          return;
        }
        const o = {
          id: uid(), name, targetDate: date, startDate: today(),
          archived:false, items:[], movements:[], fechas:[],
          // mesDesdeRec: si el día de cobro de este mes ya pasó, ese sueldo no era
          // para este objetivo — arranca el mes que viene
          recurrente: (dia >= 1 && dia <= 31 && mrec > 0)
            ? { dia, monto: mrec, activo: true, desde: mesDesdeRec(dia), hechos: [] }
            : null
        };
        if(ini > 0){
          o.movements.push({ id: uid(), date: today(), amount: ini,
            note: 'Ahorro previo', cat: 'Otro', excludeFromRate: true, itemId: null });
        }
        state.objectives.push(o);
        state.activeId = o.id;
        simA = simB = null;
        save(); closeModal(); renderTabs(); render();
     }}],
    () => document.getElementById('noName').focus());
}

/* ============================================================
   10b. MODO PRUEBA
   ============================================================ */
function renderTestBar(){
  const bar = document.getElementById('testBar');
  if(!testMode){ bar.className = ''; bar.innerHTML = ''; return; }

  bar.className = 'testbar';
  bar.innerHTML = `
    <span class="tb-tag">Modo prueba</span>
    <span class="tb-txt">Una copia de tus datos reales sacada al entrar. Nada de lo que hagas acá toca lo real.</span>
    <span class="tb-sp"></span>
    <span class="tb-lbl">Hoy es</span>
    <input type="date" id="tbDate" value="${today()}">
    <button class="btn sm ghost" data-salto="1">+1 día</button>
    <button class="btn sm ghost" data-salto="7">+1 semana</button>
    <button class="btn sm ghost" data-salto="30">+1 mes</button>
    <button class="btn sm ghost" data-salto="-1">−1 día</button>
    <button class="btn sm ghost" id="tbReal">Fecha real</button>
    <button class="btn sm ghost danger" id="tbVaciar">Volver a copiar lo real</button>
    <button class="btn sm" id="tbSalir">Volver a lo real</button>`;

  document.getElementById('tbDate').onchange = e => setFakeToday(e.target.value || null);
  bar.querySelectorAll('[data-salto]').forEach(b => b.onclick = () => {
    const n = Number(b.dataset.salto);
    const destino = addDays(today(), n);
    // Si en el camino hay un día de cobro sin confirmar, frenamos ahí: en modo prueba
    // saltearse el sueldo de un mes hace que todo lo que venga después sea mentira.
    if(n > 0){
      const cobro = proximoCobro(today(), destino);
      if(cobro){ setFakeToday(cobro); return; }
    }
    setFakeToday(destino);
  });
  document.getElementById('tbReal').onclick = () => setFakeToday(null);
  document.getElementById('tbSalir').onclick = () => setTestMode(false);
  document.getElementById('tbVaciar').onclick = () => {
    if(!confirm('¿Descartar lo que hiciste en la prueba y volver a copiar tus datos reales?\n\nTus datos reales no se tocan.')) return;
    // en medio de la prueba, lo real hay que leerlo de su caja: state es el sandbox
    let real = null;
    try{ real = JSON.parse(lsGet(KEY_REAL) || 'null'); }catch(e){}
    state = normalize(real || {});
    state.settings.fakeToday = null; fakeToday = null;
    save(); renderRate(); renderTabs(); render(); renderTestBar();
  };
}

function toggleTestMode(){
  if(testMode){ setTestMode(false); return; }
  // Foto de tus datos reales tal como están en este momento: el sandbox arranca
  // idéntico a lo real (objetivos, ítems, movimientos, sueldo) y de ahí jugás.
  const foto = structuredClone(state);
  foto.settings.fakeToday = null;
  setTestMode(true);          // cambia a la caja de prueba
  state = foto;               // ...y la pisa con la foto recién sacada
  fakeToday = null;
  save();
  renderRate(); render(); renderTestBar();
}

/* ============================================================
   10c. PANEL LATERAL
   ============================================================ */
const drawer = document.getElementById('drawer');
const scrim  = document.getElementById('scrim');

function openDrawer(){
  renderDrawer();
  drawer.classList.add('show'); scrim.classList.add('show');
  drawer.setAttribute('aria-hidden','false');
  document.getElementById('btnMenu').setAttribute('aria-expanded','true');
  document.body.style.overflow = 'hidden';
  const p = drawer.querySelector('button,input,select'); if(p) p.focus();
}
function closeDrawer(){
  drawer.classList.remove('show'); scrim.classList.remove('show');
  drawer.setAttribute('aria-hidden','true');
  document.getElementById('btnMenu').setAttribute('aria-expanded','false');
  document.body.style.overflow = '';
}
scrim.onclick = closeDrawer;
document.getElementById('btnMenu').onclick = () =>
  drawer.classList.contains('show') ? closeDrawer() : openDrawer();

function renderDrawer(){
  const o = activeObj();
  const c = o ? compute(o) : null;
  const s = state.settings.sueldo;
  const r = state.settings.rate;
  const activos = state.objectives.filter(x => !x.archived);
  const asignado = pctAsignado(null);

  // --- reparto del sueldo
  const filas = activos.map(x => `<div class="rep-row">
      <div class="rn">${esc(x.name)}
        <small>${s.monto>0 ? usd(s.monto*(x.pctSueldo||0)/100)+' USD por mes' : 'sin sueldo cargado'}</small></div>
      <input type="number" min="0" max="100" step="1" value="${x.pctSueldo||0}" data-pct="${x.id}" aria-label="Porcentaje para ${esc(x.name)}">
    </div>`).join('');

  // --- fechas de oportunidad (las conocidas + las tuyas, hasta la meta)
  let fechasHtml = '';
  if(o && c){
    fechasHtml = c.fechasClave.length
      ? c.fechasClave.map(f => `<div class="rep-row">
          <div class="rn">${esc(f.name)}
            <small>${fmtLong(f.date)} · en ${humanDays(f.dias)} · llegás con ${Math.round(f.pct*100)}%</small></div>
          ${f.fija ? '<span class="cap" style="text-align:right;font-size:11px">fija</span>'
                   : `<button class="ord-btn" data-del-fecha="${f.id}" title="Quitar" style="justify-self:end">${ico('x',12)}</button>`}
        </div>`).join('')
      : `<div class="cap">No hay fechas entre hoy y tu meta del ${fmtLong(o.targetDate)}.</div>`;
  }

  drawer.innerHTML = `
    <div class="drawer-h">
      <h2>Menú</h2>
      <button class="iconbtn" id="dClose" aria-label="Cerrar">${ico('x')}</button>
    </div>

    <div class="dsec">
      <h3>${ico('wallet')} Sueldo y reparto</h3>
      <label class="check" style="margin-bottom:12px">
        <input type="checkbox" id="dSueldoOn" ${s.activo?'checked':''}>
        Destino parte del sueldo a mis objetivos
      </label>
      <div id="dSueldoBox" style="${s.activo?'':'display:none'}">
        <div class="row" style="margin-bottom:14px">
          <div class="f xs"><label>Cobro el día</label>
            <input type="number" min="1" max="31" id="dSueldoDia" value="${s.dia}"></div>
          <div class="f"><label>Monto total USD</label>
            <input type="number" min="0" step="0.01" id="dSueldoMonto" value="${s.monto||''}" placeholder="200"></div>
        </div>
        <div class="rep">${filas || '<div class="cap">Creá un objetivo para repartirlo.</div>'}</div>
        <div class="rep-tot ${asignado>100?'over':''}">
          <span>Asignado</span>
          <b>${asignado}% ${s.monto>0?'· '+usd(s.monto*Math.min(100,asignado)/100)+' USD':''}</b>
        </div>
        <div class="hint" style="margin-top:8px">
          Lo que no asignás no se registra en ningún objetivo. El día ${s.dia} de cada mes
          te aviso una sola vez y se reparte solo.
        </div>
      </div>
    </div>

    <div class="dsec">
      <h3>${ico('flag')} Fechas de oportunidad</h3>
      <div class="rep">${fechasHtml || '<div class="cap">Elegí un objetivo primero.</div>'}</div>
      ${o ? `<button class="btn sm" id="dAddFecha" style="margin-top:12px">${ico('plus')} Agregar fecha</button>` : ''}
      <div class="hint" style="margin-top:10px">
        El Black Friday y Navidad los calculo solos. Sumá las que te sirvan: Hot Sale,
        CyberMonday, el aguinaldo.
      </div>
    </div>

    ${o ? `<div class="dsec">
      <h3>${ico('spark')} ¿Qué pasa si…?</h3>
      <div class="f" style="margin-bottom:10px"><label>Si meto por día (USD)</label>
        <input id="simA" type="number" step="0.01" min="0" value="${simA==null?(c.reqDia!==Infinity&&c.reqDia>0?(Math.round(c.reqDia*100)/100):5):simA}"></div>
      <div class="sim-out" id="simOutA"></div>
      <div class="f" style="margin:14px 0 10px"><label>Si quiero llegar el</label>
        <input id="simB" type="date" value="${simB||o.targetDate}"></div>
      <div class="sim-out" id="simOutB"></div>
    </div>` : ''}

    <div class="dsec">
      <h3>${ico('gear')} Herramientas</h3>
      <div class="rep-row" style="border:0;padding-top:0">
        <div class="rn">Cotización del dólar
          <small>${r.value ? '$'+nfARS.format(Math.round(r.value))+' · '+(r.source==='manual'?'a mano':(r.source||'auto')) : 'sin dato'}</small></div>
        <button class="btn sm ghost" id="dRate" style="justify-self:end">Cambiar</button>
      </div>
      <div class="rep-row">
        <div class="rn">Tema<small>${state.settings.theme==='dark'?'Oscuro':'Claro'}</small></div>
        <button class="btn sm ghost" id="dTheme" style="justify-self:end">Cambiar</button>
      </div>
      <div class="rep-row">
        <div class="rn">Copia de seguridad<small>Bajá o restaurá tus datos</small></div>
        <span style="display:flex;gap:6px;justify-self:end">
          <button class="btn sm ghost" id="dExport" title="Bajar">${ico('down2')}</button>
          <button class="btn sm ghost" id="dImport" title="Restaurar">${ico('up2')}</button>
        </span>
      </div>
      <div class="rep-row" style="border:0">
        <div class="rn">Modo prueba<small>${testMode?'Activo ahora':'Copia tus datos y viajá en el tiempo'}</small></div>
        <button class="btn sm ${testMode?'primary':'ghost'}" id="dTest" style="justify-self:end">
          ${testMode?'Salir':'Entrar'}</button>
      </div>
    </div>`;

  wireDrawer(o,c);
}

function wireDrawer(o,c){
  const $ = s => drawer.querySelector(s);
  $('#dClose').onclick = closeDrawer;

  /* -- sueldo global -- */
  const on = $('#dSueldoOn');
  on.onchange = () => {
    state.settings.sueldo.activo = on.checked;
    save(); renderDrawer(); render();
  };
  const gd = $('#dSueldoDia'), gm = $('#dSueldoMonto');
  if(gd) gd.onchange = () => {
    state.settings.sueldo.dia = Math.max(1, Math.min(31, Number(gd.value)||1));
    save(); renderDrawer(); render();
  };
  if(gm) gm.onchange = () => {
    state.settings.sueldo.monto = Math.max(0, Number(gm.value)||0);
    save(); renderDrawer(); render();
  };

  drawer.querySelectorAll('[data-pct]').forEach(inp => inp.onchange = () => {
    const obj = state.objectives.find(x => x.id === inp.dataset.pct);
    if(!obj) return;
    const pedido = Math.max(0, Math.min(100, Math.round(Number(inp.value)||0)));
    const otros = pctAsignado(obj.id);
    if(otros + pedido > 100){
      // no se puede repartir más del sueldo que entra
      alert('No te alcanza: ya tenés ' + otros + '% repartido en los otros objetivos.\n\n'
          + 'A este le podés poner hasta ' + (100 - otros) + '%.');
      inp.value = obj.pctSueldo || 0;
      return;
    }
    obj.pctSueldo = pedido;
    save(); renderDrawer(); render();
  });

  /* -- fechas de oportunidad -- */
  const af = $('#dAddFecha');
  if(af) af.onclick = () => {
    closeDrawer();
    modal('Nueva fecha de oportunidad', `<div class="stack">
        <div class="f"><label>Qué es</label>
          <input id="nfName" placeholder="Ej: Hot Sale, CyberMonday, aguinaldo" maxlength="40"></div>
        <div class="f"><label>Cuándo</label>
          <input id="nfDate" type="date" value="${addDays(today(),30)}"></div>
        <div class="hint">Te muestro con qué porcentaje del objetivo llegás a esa fecha.</div>
      </div>`,
      [{label:'Cancelar', onClick: closeModal},
       {label:'Agregar', cls:'primary', onClick: () => {
          const n = document.getElementById('nfName').value.trim();
          const d = document.getElementById('nfDate').value;
          if(!n || !d) return;
          o.fechas.push({ id: uid(), name: n, date: d });
          save(); closeModal(); render(); openDrawer();
       }}],
      () => document.getElementById('nfName').focus());
  };
  drawer.querySelectorAll('[data-del-fecha]').forEach(b => b.onclick = () => {
    o.fechas = o.fechas.filter(f => f.id !== b.dataset.delFecha);
    save(); renderDrawer(); render();
  });

  /* -- simulador -- */
  const sa = $('#simA'), sb = $('#simB');
  if(sa){
    sa.oninput = () => { simA = sa.value; renderSim(o,c); };
    sb.onchange = () => { simB = sb.value; renderSim(o,c); };
    if(simA == null) simA = sa.value;
    if(simB == null) simB = sb.value;
    renderSim(o,c);
  }

  /* -- herramientas -- */
  $('#dRate').onclick = () => { closeDrawer(); rateModal(); };
  $('#dTheme').onclick = () => {
    state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = state.settings.theme;
    save(); render(); renderDrawer();
  };
  $('#dExport').onclick = exportarBackup;
  $('#dImport').onclick = () => document.getElementById('fileImport').click();
  $('#dTest').onclick = () => { closeDrawer(); toggleTestMode(); };
}

/* ============================================================
   10d. LÁPIZ: objetivos y ajustes
   ============================================================ */
function editModal(){
  const o = activeObj();
  const lista = state.objectives.map(x => {
    const cc = compute(x);
    return `<button class="orow ${x.id===state.activeId?'on':''} ${x.archived?'arch':''}" data-goto="${x.id}">
      <span class="oi"><b>${esc(x.name)}</b>
        <small>${fmtLong(x.targetDate)}${x.archived?' · archivado':''}</small></span>
      <span class="op">${Math.round(cc.pct*100)}%</span>
    </button>`;
  }).join('');

  const cuerpo = `<div class="stack">
      <div>
        <div class="eyebrow" style="margin-bottom:10px">${ico('target')} Tus objetivos</div>
        <div class="olist">${lista || '<div class="cap">Todavía no creaste ninguno.</div>'}</div>
        <button class="btn sm" id="eNuevo">${ico('plus')} Nuevo objetivo</button>
      </div>
      ${o ? `
      <div class="sep"></div>
      <div class="eyebrow" style="margin-bottom:2px">${ico('pencil')} Editar «${esc(o.name)}»</div>
      <div class="f"><label>Nombre</label><input id="eName" value="${esc(o.name)}" maxlength="60"></div>
      <div class="row">
        <div class="f"><label>Fecha meta</label><input id="eDate" type="date" value="${o.targetDate}"></div>
        <div class="f"><label>Arrancó el</label><input id="eStart" type="date" value="${o.startDate}"></div>
      </div>
      <div class="hint">«Arrancó el» es desde cuándo se traza el plan ideal. El sueldo y su reparto
        se configuran en el menú lateral, porque son uno solo para todos los objetivos.</div>
      <div class="sep"></div>
      <div class="row">
        <button class="btn sm" id="eArch">${ico('archive')} ${o.archived?'Desarchivar':'Archivar'}</button>
        <div class="spacer"></div>
        <button class="btn sm danger ghost" id="eDel">${ico('trash')} Borrar objetivo</button>
      </div>` : ''}
    </div>`;

  modal('Objetivos y ajustes', cuerpo, [{label:'Listo', cls:'primary', onClick: closeModal}], () => {
    const $ = s => document.querySelector(s);
    document.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => {
      state.activeId = b.dataset.goto;
      chartOffset = 0; zoomDays = null; zoomStart = 0; simA = null; simB = null;
      save(); closeModal(); render();
    });
    $('#eNuevo').onclick = () => { closeModal(); objModal(); };
    if(!o) return;

    $('#eName').onchange = () => { const v=$('#eName').value.trim(); if(v){ o.name=v; save(); render(); } };
    $('#eDate').onchange = () => {
      const v = $('#eDate').value; if(!v) return;
      if(v <= o.startDate){ alert('La fecha meta tiene que ser posterior al arranque ('+fmtDate(o.startDate)+').');
        $('#eDate').value = o.targetDate; return; }
      o.targetDate = v; save(); render();
    };
    $('#eStart').onchange = () => {
      const v = $('#eStart').value; if(!v) return;
      if(v >= o.targetDate){ alert('El arranque tiene que ser anterior a la meta ('+fmtDate(o.targetDate)+').');
        $('#eStart').value = o.startDate; return; }
      o.startDate = v; save(); render();
    };
    $('#eArch').onclick = () => {
      o.archived = !o.archived;
      if(o.archived){ const n = state.objectives.find(x => !x.archived); state.activeId = n ? n.id : o.id; }
      save(); closeModal(); render();
    };
    $('#eDel').onclick = () => {
      if(!confirm('¿Borrar «'+o.name+'» con todos sus ítems y movimientos?\n\nEsto no se puede deshacer.')) return;
      state.objectives = state.objectives.filter(x => x.id !== o.id);
      const n = state.objectives.find(x => !x.archived) || state.objectives[0];
      state.activeId = n ? n.id : null;
      save(); closeModal(); render();
    };
  });
}
document.getElementById('btnEdit').onclick = editModal;

/* ============================================================
   10e. MODAL DE MONTO (sale del botón, número grande)
   ============================================================ */
function montoModal(signo){
  const o = activeObj(); if(!o) return;
  const c = compute(o);
  const cats = signo > 0 ? CATS_IN : CATS_OUT;
  const atajos = signo > 0 ? [10,20,50,100] : [10,20,50,100];

  modal('', `
    <div class="monto-tag ${signo>0?'in':'out'}">${ico(signo>0?'up2':'down2')} ${signo>0?'Agregar':'Sacar'}</div>
    <div class="monto-wrap">
      <span class="sg">${signo>0?'+':'−'}</span>
      <input id="montoIn" type="number" inputmode="decimal" step="0.01" min="0"
             placeholder="0" autocomplete="off" aria-label="Monto en dólares">
    </div>
    <div class="monto-ars" id="montoArs">USD</div>
    <div class="monto-chips">
      ${atajos.map(v => `<button type="button" data-add="${v}">+${v}</button>`).join('')}
    </div>
    <div class="f" style="margin-top:16px;text-align:left">
      <label>${signo>0?'De dónde salió':'Para qué'}</label>
      <select id="montoCat">${cats.map(x=>`<option>${x}</option>`).join('')}</select>
    </div>`,
    [{label:'Cancelar', onClick: closeModal},
     {label: signo>0?'Sumar':'Sacar', cls:'primary', onClick: () => {
        const v = Number(document.getElementById('montoIn').value);
        if(!isFinite(v) || v <= 0){ document.getElementById('montoIn').focus(); return; }
        const monto = signo * v;
        o.movements.push({ id: uid(), date: today(), amount: monto, note: '',
          cat: document.getElementById('montoCat').value,
          excludeFromRate: false, itemId: null, recYm: null,
          diasPlan: diasQueMueve(monto, c) });
        save(); closeModal(); render();
        flashMov(monto, diasQueMueve(monto, c));
     }}],
    () => {
      const inp = document.getElementById('montoIn');
      const eq  = document.getElementById('montoArs');
      const upd = () => {
        const v = Number(inp.value);
        eq.textContent = (isFinite(v) && v > 0 && ars(v)) ? ars(v) : 'USD';
        // el campo crece con el número para que siempre quede centrado
        inp.style.width = Math.max(2, String(inp.value||'0').length + .4) + 'ch';
      };
      inp.oninput = upd; upd();
      inp.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault();
        ov.querySelector('.mf .btn.primary').click(); } };
      document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
        inp.value = (Number(inp.value)||0) + Number(b.dataset.add); upd(); inp.focus();
      });
      setTimeout(() => inp.focus(), 60);
    }, 'monto-mod');
}

/** Aviso flotante con los días que te movió el aporte */
function flashMov(monto, dd){
  const el = document.createElement('div');
  el.className = 'toast ' + (monto >= 0 ? 'in' : 'out');
  el.innerHTML = (monto>=0?'+':'−') + usd(Math.abs(monto)) + ' USD'
    + (dd ? ' <b>· ' + (dd>0 ? 'te adelantaste '+dd : 'te atrasaste '+Math.abs(dd))
          + ' día' + (Math.abs(dd)===1?'':'s') + '</b>' : '');
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(()=>el.remove(), 400); }, 3400);
}

/* ============================================================
   11. COTIZACIÓN A MANO / TEMA / BACKUP
   ============================================================ */
function rateModal(){
  const r = state.settings.rate;
  modal('Cotización del dólar', `<div class="stack">
      <div class="f"><label>Pesos por dólar (venta)</label>
        <input id="rIn" type="number" step="0.01" min="0" value="${r.value||''}" placeholder="1520"></div>
      <div class="hint">Se usa <b>solo para mostrarte el equivalente en pesos</b> al lado de cada número.
        Tus aportes los cargás en dólares, así que mover esto no cambia tu progreso.<br><br>
        Fuente actual: <b>${r.source ? esc(r.source) : 'ninguna'}</b>${
        r.fetchedAt && !isNaN(new Date(r.fetchedAt)) ? ' · '+fmtDate(toKey(new Date(r.fetchedAt))) : ''}.</div>
    </div>`,
    [{label:'Cancelar', onClick: closeModal},
     {label:'Buscar automática', onClick: async () => {
        closeModal();
        const ok = await fetchRate();
        if(!ok) alert('No se pudo traer la cotización.\n\nPuede ser que no tengas internet o que el navegador bloquee el pedido.\nCargala a mano desde el mismo botón.');
     }},
     {label:'Guardar', cls:'primary', onClick: () => {
        const v = Number(document.getElementById('rIn').value);
        if(!isFinite(v) || v <= 0) return;
        state.settings.rate = { value:v, source:'manual', fetchedAt:new Date().toISOString() };
        save(); closeModal(); renderRate(); render();
     }}],
    () => document.getElementById('rIn').focus());
}

function exportarBackup(){
  // el backup lleva la marca de la caja de la que salió, para no pisar datos reales
  // con datos de juguete sin darse cuenta
  const data = Object.assign({}, state, { sandbox: testMode ? true : undefined });
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (testMode ? 'ahorro-PRUEBA-' : 'ahorro-backup-')+today()+'.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

document.getElementById('fileImport').onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const crudo = JSON.parse(rd.result);
      if(crudo && crudo.sandbox && !testMode){
        if(!confirm('OJO: este backup salió del MODO PRUEBA (datos de juguete).\n\n'
          + 'Estás en modo real: si seguís, pisás tus datos de verdad con los de prueba.\n'
          + '¿Seguro que querés hacer eso?')) return;
      }
      const s = normalize(crudo);
      if(!confirm('Vas a reemplazar TODOS los datos actuales por los del archivo.\n\n'
        + s.objectives.length + ' objetivo(s) en el backup. ¿Seguir?')) return;
      state = s;
      document.documentElement.dataset.theme = state.settings.theme || 'dark';
      save(); renderRate(); render();
    }catch(err){
      alert('El archivo no es un backup válido.\n\n'+err.message);
    }
  };
  rd.readAsText(f);
  e.target.value = '';
};

   12. ARRANQUE
   ============================================================ */

document.getElementById('btnMenu').innerHTML = ico('menu');
document.getElementById('btnEdit').innerHTML = ico('pencil');

document.documentElement.dataset.theme = state.settings.theme || 'dark';
renderRate();
renderTestBar();
renderTabs();
render();

// La cotización solo se busca si la guardada no es de hoy.
(function(){
  const f = state.settings.rate.fetchedAt;
  const fresca = f && !isNaN(new Date(f)) && toKey(new Date(f)) === toKey(new Date());
  if(!fresca) fetchRate();
})();
