<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahorro · Objetivos</title>
<style>
/* ============================================================
   PALETA
   ============================================================ */
:root{
  /* Fondo casi negro con sesgo navy: deja que las tarjetas floten por contraste
     y no por sombras, como en las referencias. */
  --bg:#050B14;
  --bg-a:#081326;
  --bg-b:#050B14;
  --card:#0B1523;
  --card-2:#101E31;
  --card-3:#17293F;
  --line:#1A2C44;
  --line-soft:#132133;
  --txt:#EFF5FC;
  --muted:#8098B8;
  --dim:#7A96B4;
  /* El menta es un recurso escaso: solo estado positivo y progreso real.
     Las cifras protagonistas van en --txt, no en acento. */
  --acc:#2FD6A0;
  --acc-2:#17A87E;
  --acc-glow:rgba(47,214,160,.13);
  --warn:#F5B544;
  --bad:#FF6B7A;
  --blue:#5AA2FF;
  --shadow:none;
  --r:18px;
  --r-sm:12px;
  --ease:cubic-bezier(.22,.68,.36,1);
}
html[data-theme="light"]{
  --bg:#EEF2F7;
  --bg-a:#F6F9FC;
  --bg-b:#E9EFF6;
  --card:#FFFFFF;
  --card-2:#F2F6FA;
  --card-3:#E5EDF5;
  --line:#DCE5EF;
  --line-soft:#EAF0F6;
  --txt:#08182B;
  --muted:#556F8D;
  --dim:#6C819A;
  --acc:#0E9B72;
  --acc-2:#0A7355;
  --acc-glow:rgba(14,155,114,.10);
  --warn:#B87A08;
  --bad:#D14453;
  --blue:#2B7FD4;
  --shadow:none;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 700px at 10% -12%, var(--bg-a) 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--txt);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ============================================================
   PRIMITIVAS TIPOGRÁFICAS
   La cifra manda: enorme, apretada, en color de texto (no de acento).
   ============================================================ */
.eyebrow{
  display:flex;align-items:center;gap:7px;
  font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);
}
.eyebrow svg{width:13px;height:13px;flex:none;stroke-width:2}

.figure{
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
  font-weight:700;letter-spacing:-.045em;line-height:.92;color:var(--txt);
  display:inline-flex;align-items:baseline;gap:.12em;
}
.figure .unit{
  font-size:.34em;font-weight:600;letter-spacing:0;color:var(--muted);
  align-self:flex-start;margin-top:.35em;
}
.figure.xl{font-size:clamp(42px,7.5vw,72px)}
.figure.lg{font-size:clamp(28px,4.4vw,40px);letter-spacing:-.035em}
.figure.md{font-size:clamp(22px,3vw,28px);letter-spacing:-.03em}
.figure.acc{color:var(--acc)}
.figure.bad{color:var(--bad)}
.figure.warn{color:var(--warn)}

.cap{font-size:12.5px;color:var(--muted);line-height:1.45}
.cap b{color:var(--txt);font-weight:600}
h1,h2,h3{text-wrap:balance}

/* ============================================================
   LAYOUT
   ============================================================ */
.wrap{max-width:1120px;margin:0 auto;padding:22px 20px 90px}

/* ---- topbar ---- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.2px;font-size:17px}
.brand .dot{
  width:26px;height:26px;border-radius:8px;flex:none;
  background:linear-gradient(140deg,var(--acc),var(--acc-2));
  box-shadow:0 0 0 1px rgba(255,255,255,.09) inset, 0 6px 16px -6px var(--acc);
  display:grid;place-items:center;color:#04241a;font-size:14px;font-weight:900;
}
.spacer{flex:1}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.chip{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--card);border:1px solid var(--line);
  padding:7px 11px;border-radius:10px;font-size:12.5px;color:var(--muted);
  white-space:nowrap;
}
.chip b{color:var(--txt);font-weight:600}
.chip .live{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none;
  box-shadow:0 0 0 3px var(--acc-glow)}
.chip .live.stale{background:var(--warn);box-shadow:0 0 0 3px rgba(245,181,68,.15)}
.chip.click{cursor:pointer;transition:border-color .15s,color .15s}
.chip.click:hover{border-color:var(--acc);color:var(--txt)}

button{font-family:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--card-2);color:var(--txt);
  border:1px solid var(--line);border-radius:10px;
  padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:background .18s var(--ease),border-color .18s var(--ease),
             color .18s var(--ease),transform .12s var(--ease);
}
.btn svg{width:14px;height:14px;stroke-width:2;flex:none}
.btn:hover{background:var(--card-3);border-color:var(--card-3)}
.btn:active{transform:scale(.975)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.primary{background:var(--acc);color:#04201A;border-color:var(--acc);font-weight:700}
.btn.primary:hover{background:#43E3B0;border-color:#43E3B0}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--card-2);color:var(--txt)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);background:rgba(255,107,122,.08)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:0;width:34px;height:34px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn[disabled]:hover{background:var(--card-2);border-color:var(--line)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

/* ---- tabs de objetivos ---- */
.tabs{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{
  position:relative;
  background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px 15px;cursor:pointer;
  min-width:150px;text-align:left;color:var(--muted);
  transition:border-color .15s,background .15s,transform .08s;
}
.tab:hover{border-color:var(--card-3);background:var(--card-2)}
.tab .t-name{display:block;font-weight:650;font-size:13.5px;color:var(--txt);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.tab .t-sub{display:block;font-size:11.5px;margin-top:2px}
/* display:block es obligatorio: como span inline el height no aplica y la barra se desborda */
.tab .t-bar{display:block;height:3px;border-radius:2px;background:var(--line-soft);margin-top:8px;overflow:hidden}
.tab .t-bar i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .4s ease}
.tab.active{border-color:var(--acc);background:var(--card-2);
  box-shadow:0 0 0 1px var(--acc) inset, 0 10px 26px -18px var(--acc)}
.tab.active .t-sub{color:var(--acc)}
.tab.arch .t-name{opacity:.55}
.tab.add{display:grid;place-items:center;min-width:46px;color:var(--acc);font-size:20px;font-weight:700;padding:0 16px}

/* ---- cards ---- */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);
  transition:border-color .25s var(--ease),background .25s var(--ease);
}
.card:hover{border-color:var(--card-3)}
/* separación pareja entre todos los bloques de la vista */
#app > * + *{margin-top:14px}
.card-h{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:17px 22px 14px;
}
.card-h h2{
  margin:0;font-size:10.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:7px;
}
.card-h h2 svg{width:13px;height:13px;stroke-width:2}
.card-b{padding:6px 22px 22px}

/* ---- hero: la cifra grande a la izquierda, el anillo como acompañante ---- */
.hero{display:grid;grid-template-columns:1fr 188px;gap:32px;align-items:center;padding:8px 0 4px}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:24px}}

.hero-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.h-title h1{margin:0;font-size:clamp(20px,2.6vw,26px);font-weight:680;letter-spacing:-.02em}
.h-meta{color:var(--muted);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.h-meta b{color:var(--txt);font-weight:600}
.h-meta .dot-sep{width:3px;height:3px;border-radius:50%;background:var(--dim);flex:none}

.h-figure{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.h-figure .sub{font-size:12.5px;color:var(--muted);padding-bottom:6px}
.h-figure .sub b{color:var(--txt);font-weight:600}

.ring{position:relative;width:188px;height:188px;flex:none;justify-self:end}
@media(max-width:760px){.ring{justify-self:start;width:150px;height:150px}}
.ring svg{transform:rotate(-90deg);display:block;width:100%;height:100%}
.ring .rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:3px}
.ring .pct{font-size:clamp(26px,4vw,34px);font-weight:700;letter-spacing:-.04em;line-height:1;
  font-variant-numeric:tabular-nums}
.ring .of{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* ---- estado: barra lateral de color en vez de caja teñida ---- */
.status{
  display:flex;align-items:flex-start;gap:11px;
  padding:12px 16px;font-size:13.5px;line-height:1.5;color:var(--muted);
  border-left:2px solid var(--line);background:var(--card-2);
  border-radius:0 var(--r-sm) var(--r-sm) 0;
}
.status .ico{flex:none;margin-top:1px}
.status .ico svg{width:16px;height:16px;stroke-width:2}
.status b{font-weight:650;color:var(--txt)}
.status.ok{border-left-color:var(--acc)}
.status.ok .ico{color:var(--acc)}
.status.mid{border-left-color:var(--warn)}
.status.mid .ico{color:var(--warn)}
.status.bad{border-left-color:var(--bad)}
.status.bad .ico{color:var(--bad)}

/* ---- fichas de estadística ---- */
.mgrid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  margin-top:16px;padding-top:16px;border-top:1px solid var(--line-soft);
}
@media(max-width:860px){.mgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.mgrid{grid-template-columns:1fr}}
.m{
  background:var(--card-2);border:1px solid transparent;border-radius:var(--r-sm);
  padding:14px 15px 13px;display:flex;flex-direction:column;gap:8px;
  transition:border-color .2s var(--ease),transform .2s var(--ease);
}
.m:hover{border-color:var(--line);transform:translateY(-1px)}
.m .lbl{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);font-weight:700}
.m .val{font-size:clamp(21px,2.6vw,27px);font-weight:700;letter-spacing:-.035em;line-height:1;
  font-variant-numeric:tabular-nums}
.m .val .unit{font-size:.42em;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:.15em}
.m .sub{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:auto}
.m .val.acc{color:var(--acc)}
.m .val.warn{color:var(--warn)}
.m .val.bad{color:var(--bad)}
.m .val.sm{font-size:16px;letter-spacing:-.01em;line-height:1.25}
.m .spark{height:26px;margin:-2px 0}
.m .spark svg{width:100%;height:100%;display:block;overflow:visible}

/* ---- barras comparativas (patrón de la referencia) ---- */
.cmp{display:flex;flex-direction:column;gap:20px}
.cmp-row{display:grid;grid-template-columns:1fr auto;gap:5px 16px;align-items:baseline}
.cmp-row .nm{font-size:14px;font-weight:600;color:var(--txt);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-row .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--dim);margin-top:2px}
.cmp-row .fg{justify-self:end;text-align:right}
.cmp-row .track{
  grid-column:1/-1;height:6px;border-radius:99px;background:var(--card-3);overflow:hidden;margin-top:3px;
}
.cmp-row .track i{
  display:block;height:100%;border-radius:99px;background:var(--acc);
  transition:width .6s var(--ease);
}
/* los que todavía no están en curso se muestran apagados, como en la referencia */
.cmp-row.dim .nm,.cmp-row.dim .figure{color:var(--muted)}
.cmp-row.dim .track i{background:var(--dim);opacity:.55}
.cmp-row.done .nm{text-decoration:line-through;color:var(--dim)}
.cmp-row.done .track i{background:var(--dim);opacity:.4}
.cmp-row.done .figure{color:var(--dim)}

/* ---- ítems: las acciones aparecen al pasar el mouse para no ensuciar la fila ---- */
.i-acts{
  display:flex;gap:2px;align-items:center;justify-content:flex-end;
  opacity:0;transition:opacity .2s var(--ease);
}
.cmp-row:hover .i-acts,.cmp-row:focus-within .i-acts{opacity:1}
@media(hover:none){.i-acts{opacity:1}}   /* en táctil no hay hover: siempre visibles */
.ord-btn{
  background:none;border:0;color:var(--dim);cursor:pointer;
  padding:7px;min-width:28px;min-height:28px;border-radius:7px;display:grid;place-items:center;
  transition:color .15s var(--ease),background .15s var(--ease);
}
.ord-btn svg{stroke-width:2.2}
.ord-btn:hover:not([disabled]){color:var(--txt);background:var(--card-3)}
.ord-btn[disabled]{opacity:.2;cursor:default}
.ord-btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

.ready-note{
  grid-column:1/-1;margin-top:10px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--acc-glow);border-left:2px solid var(--acc);
  border-radius:0 var(--r-sm) var(--r-sm) 0;padding:10px 14px;font-size:13px;color:var(--muted);
}
.ready-note b{color:var(--acc);font-weight:650}
.ready-note svg{color:var(--acc);vertical-align:-2px}

/* ---- formularios ---- */
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
.f.sm{flex:0 0 128px;min-width:128px}
.f.xs{flex:0 0 104px;min-width:104px}
.f label{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);font-weight:700}
input,select,textarea{
  background:var(--card-2);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:9px 11px;font-size:14px;font-family:inherit;width:100%;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow);
}
input::placeholder{color:var(--dim)}
input[type=date]{color-scheme:dark}
html[data-theme="light"] input[type=date]{color-scheme:light}
.seg{display:flex;background:var(--card-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{
  flex:1;background:none;border:0;color:var(--muted);cursor:pointer;
  padding:6px 10px;border-radius:7px;font-size:13px;font-weight:650;
}
.seg button.on{background:var(--card-3);color:var(--txt)}
.seg button.on.in{background:rgba(47,214,160,.16);color:var(--acc)}
.seg button.on.out{background:rgba(255,107,122,.14);color:var(--bad)}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.check input{width:15px;height:15px;accent-color:var(--acc);flex:none}

/* ---- movimientos: filas de libro contable, regla fina y cifra a la derecha ---- */
.mv-list{max-height:340px;overflow-y:auto;margin:0 -22px -22px;padding:0 22px 8px}
.mv{
  display:flex;align-items:center;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--line-soft);font-size:13.5px;
  transition:background .15s var(--ease);
}
.mv:last-child{border-bottom:0}
.mv:hover{background:linear-gradient(90deg,transparent,var(--card-2) 6%,var(--card-2) 94%,transparent)}
.mv .d{color:var(--dim);font-size:11.5px;width:62px;flex:none;font-variant-numeric:tabular-nums}
.mv .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.mv .n .tag{
  font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);
  border-radius:4px;padding:2px 6px;margin-left:8px;white-space:nowrap;
}
.mv .a{font-weight:650;white-space:nowrap;text-align:right;display:flex;flex-direction:column;
  align-items:flex-end;gap:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mv .a .dias{font-style:normal;font-size:10px;font-weight:500;color:var(--dim);letter-spacing:.02em}
.mv .a.in{color:var(--acc)}
.mv .a.out{color:var(--bad)}
.mv .x{
  background:none;border:0;color:var(--card-3);cursor:pointer;padding:4px;border-radius:6px;flex:none;
  display:grid;place-items:center;transition:color .15s var(--ease),background .15s var(--ease);
}
.mv .x svg{width:14px;height:14px;stroke-width:2}
.mv:hover .x{color:var(--dim)}
.mv .x:hover{color:var(--bad);background:rgba(255,107,122,.1)}

/* ---- grid 2col ---- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.two > .card{margin-top:0}

/* ---- simulador ---- */
.sim-out{
  background:var(--card-2);border:1px solid var(--line);border-radius:11px;
  padding:13px 15px;margin-top:11px;font-size:14px;line-height:1.6;
}
.sim-out b{color:var(--acc);font-weight:700}
.sim-out .big{font-size:19px;font-weight:720;letter-spacing:-.4px;display:block;margin-top:2px}

/* ---- chart ---- */
.chart-wrap{width:100%;overflow-x:auto}
svg.chart{width:100%;height:auto;display:block;min-width:520px}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:11px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:15px;height:3px;border-radius:2px;display:inline-block}

/* ---- barra de modo prueba ---- */
.testbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:9px 18px;font-size:12.5px;
  background:linear-gradient(90deg,rgba(245,181,68,.18),rgba(245,181,68,.07));
  border-bottom:1px solid rgba(245,181,68,.4);
  backdrop-filter:blur(8px);
}
.testbar .tb-tag{
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;
  color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:2px 7px;
}
.testbar .tb-txt{color:var(--muted)}
.testbar .tb-lbl{color:var(--muted);margin-left:4px}
.testbar .tb-sp{flex:1}
.testbar input[type=date]{width:auto;padding:5px 8px;font-size:12.5px;border-radius:7px}
#btnTest.on{border-color:var(--warn);color:var(--warn)}

/* ---- carga rápida ---- */
.quick{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px 18px;border-top:1px solid var(--line-soft);
}
.quick .qlbl{font-size:12.5px;color:var(--muted);white-space:nowrap}
.quick input[type=number]{
  flex:0 0 128px;font-size:17px;font-weight:650;padding:9px 12px;
  font-variant-numeric:tabular-nums;
}
.quick select{flex:0 0 130px}
.quick .qsp{flex:1}
.quick .btn.big{padding:11px 18px;font-size:14px;border-radius:11px}

/* aviso flotante tras cargar plata */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:80;
  background:var(--card-2);border:1px solid var(--line);border-radius:99px;
  padding:11px 20px;font-size:13.5px;font-weight:600;color:var(--txt);
  opacity:0;transition:opacity .3s var(--ease),transform .3s var(--ease);
  box-shadow:0 16px 40px -18px rgba(0,0,0,.85);white-space:nowrap;
  font-variant-numeric:tabular-nums;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.in{border-color:rgba(47,214,160,.4)}
.toast.in b{color:var(--acc);font-weight:600}
.toast.out{border-color:rgba(255,107,122,.4)}

<script>

"use strict";

/* ============================================================
   1. UTILIDADES DE FECHA  (siempre en hora local, nunca UTC)
   ============================================================ */
const pad = n => String(n).padStart(2,'0');

/** Date -> "AAAA-MM-DD" usando los componentes locales */
function toKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

/** "AAAA-MM-DD" -> Date local a medianoche */
function parseKey(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }

/** Nro. de día absoluto. Vía UTC para que el horario de verano no rompa las restas. */
function dayNum(s){ const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d)/86400000; }

/** Días entre dos claves (b - a) */
function diffDays(a,b){ return dayNum(b) - dayNum(a); }

function addDays(s,n){ const d = parseKey(s); d.setDate(d.getDate()+n); return toKey(d); }

/**
 * Fecha de "hoy". En modo prueba devuelve la fecha simulada, y con eso toda la app
 * (días restantes, ritmo semanal, proyección, sueldos pendientes) viaja en el tiempo
 * sin tener que tocar ningún otro cálculo.
 */
let fakeToday = null;
function today(){ return fakeToday || toKey(new Date()); }

/**
 * Black Friday: el viernes siguiente al cuarto jueves de noviembre.
 * No es "el último viernes": divergen cuando el 1/11 cae jueves (ej. 2029).
 */
function blackFriday(anio){
  const d = new Date(anio, 10, 1);
  d.setDate(1 + (4 - d.getDay() + 7) % 7 + 21);  // cuarto jueves
  d.setDate(d.getDate() + 1);                    // el viernes que le sigue
  return toKey(d);
}

/** Fechas comerciales que puedo calcular con certeza. El resto las carga el usuario. */
function fechasConocidas(desde, hasta){
  const out = [];
  for(let a = parseKey(desde).getFullYear(); a <= parseKey(hasta).getFullYear(); a++){
    out.push({ id:'bf'+a, name:'Black Friday', date: blackFriday(a), fija:true });
    out.push({ id:'nav'+a, name:'Navidad',     date: a+'-12-25',      fija:true });
  }
  return out.filter(f => f.date > desde && f.date <= hasta);
}

/** "AAAA-MM" de una fecha */
function mesDe(s){ return s.slice(0,7); }

/** Suma n meses a un "AAAA-MM" */
function addMes(ym, n){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return d.getFullYear()+'-'+pad(d.getMonth()+1);
}

/** Día `dia` del mes `ym`, recortado si el mes es más corto (31 en febrero → 28/29) */
function diaDelMes(ym, dia){
  const [y,m] = ym.split('-').map(Number);
  const ultimo = new Date(y, m, 0).getDate();
  return ym+'-'+pad(Math.min(dia, ultimo));
}

/**
 * Primer mes que cuenta para un recurrente recién creado o reactivado: si el día de
 * cobro de este mes ya pasó, ese sueldo ya se fue a otra cosa — arranca el que viene.
 */
function mesDesdeRec(dia){
  const ym = mesDe(today());
  return diaDelMes(ym, dia) < today() ? addMes(ym, 1) : ym;
}

/** dd/mm/aaaa */
function fmtDate(s){ if(!s) return '—'; const [y,m,d] = s.split('-'); return d+'/'+m+'/'+y; }

/** dd/mm */
function fmtShort(s){ const [,m,d] = s.split('-'); return d+'/'+m; }

/** Lunes de la semana que contiene a s */
function weekStart(s){
  const d = parseKey(s);
  const dow = (d.getDay()+6)%7;      // 0 = lunes
  d.setDate(d.getDate()-dow);
  return toKey(d);
}

const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtLong(s){
  if(!s) return '—';
  const [y,m,d] = s.split('-');
  return Number(d)+' '+MESES[Number(m)-1]+' '+y;
}

/* ============================================================
   2. FORMATO DE NÚMEROS
   ============================================================ */
const nfUSD = new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nfUSD0 = new Intl.NumberFormat('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0});
const nfARS = new Intl.NumberFormat('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0});

const usd  = n => nfUSD.format(n||0);
const usd0 = n => nfUSD0.format(n||0);

/** Equivalente en pesos según la cotización guardada. '' si no hay. */
function ars(n){
  const r = state.settings.rate.value;
  if(!r || !isFinite(n)) return '';
  return '$'+nfARS.format(Math.round(n*r));
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

/* ---- íconos: trazos sueltos, se pintan con currentColor. Nada de emojis. ---- */
const ICONS = {
  trend:  '<path d="M3 17 9 11l4 4 8-8"/><path d="M17 7h4v4"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
  wallet: '<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3"/><path d="M3 7.5V17a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H5.5"/><circle cx="16.5" cy="14" r="1.2"/>',
  ledger: '<path d="M5 3h11l4 4v14H5z"/><path d="M16 3v4h4"/><path d="M9 12h7M9 16h7"/>',
  chart:  '<path d="M4 20V10M10 20V5M16 20v-7M22 20H2"/>',
  spark:  '<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
  check:  '<circle cx="12" cy="12" r="9"/><path d="M8.5 12.2l2.4 2.4 4.6-4.9"/>',
  alert:  '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><circle cx="12" cy="16.4" r=".9" fill="currentColor" stroke="none"/>',
  clock:  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5.3l3.4 2"/>',
  flag:   '<path d="M5 21V4"/><path d="M5 5h11l-2 3.5L16 12H5z"/>',
  plus:   '<path d="M12 5v14M5 12h14"/>',
  x:      '<path d="M6 6l12 12M18 6L6 18"/>',
  pencil: '<path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/>',
  undo:   '<path d="M4 10h9a5 5 0 0 1 0 10h-3"/><path d="M8 6l-4 4 4 4"/>',
  up:     '<path d="M6 15l6-6 6 6"/>',
  down:   '<path d="M6 9l6 6 6-6"/>',
  gear:   '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.6M12 18.9v2.6M4.2 7.2l2.2 1.3M17.6 15.5l2.2 1.3M4.2 16.8l2.2-1.3M17.6 8.5l2.2-1.3"/>',
  sun:    '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M18.4 5.6l1.4-1.4M4.2 19.8l1.4-1.4"/>',
  down2:  '<path d="M12 3v12"/><path d="M7.5 11.5 12 16l4.5-4.5"/><path d="M4 20h16"/>',
  up2:    '<path d="M12 16V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4 20h16"/>',
  beaker: '<path d="M9 3v6.5L4.5 18A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.8-3L15 9.5V3"/><path d="M8 3h8"/><path d="M6.8 15h10.4"/>',
  menu:   '<path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17"/>',
  pct:    '<path d="M19 5 5 19"/><circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/>',
  minus:  '<path d="M5 12h14"/>',
  archive:'<path d="M3 7h18v3H3z"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/><path d="M10 14h4"/>',
  trash:  '<path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>'
};
/** Devuelve un <svg> inline. size en px. */
function ico(name, size){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" '
       + 'stroke-linejoin="round" aria-hidden="true"'
       + (size ? ' style="width:'+size+'px;height:'+size+'px"' : '') + '>'
       + (ICONS[name]||'') + '</svg>';
}

/** Cifra grande con su unidad chiquita al costado, como en la referencia */
function fig(valor, unidad, clase){
  return '<span class="figure '+(clase||'')+'">'+valor
       + (unidad ? '<span class="unit">'+unidad+'</span>' : '') + '</span>';
}

/** Sparkline: los últimos `dias` de saldo acumulado, sin ejes ni ruido */
function sparkline(o, hoy, dias){
  const ini = addDays(hoy, -dias);
  const movs = [...o.movements].filter(m => m.date <= hoy).sort((a,b)=>a.date.localeCompare(b.date));
  let acc = 0;
  const serie = [];
  movs.forEach(m => { acc += m.amount; if(m.date >= ini) serie.push([m.date, acc]); });
  const base = movs.filter(m => m.date < ini).reduce((s,m)=>s+m.amount, 0);
  const pts = [[ini, base], ...serie, [hoy, acc]];
  if(pts.length < 2) return '';
  const vals = pts.map(p=>p[1]);
  const lo = Math.min(...vals), hi = Math.max(...vals), rango = (hi-lo) || 1;
  const W = 100, H = 26;
  const X = k => (Math.max(0, diffDays(ini,k)) / dias) * W;
  const Y = v => H - 3 - ((v-lo)/rango) * (H-6);
  const d = pts.map((p,i) => (i?'L':'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  const fin = pts[pts.length-1];
  const sube = fin[1] >= pts[0][1];
  const col = sube ? 'var(--acc)' : 'var(--bad)';
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"
          stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(fin[0]).toFixed(1)}" cy="${Y(fin[1]).toFixed(1)}" r="2" fill="${col}"
            vector-effect="non-scaling-stroke"/>
  </svg></div>`;
}

/** Días -> texto humano ("2 meses y 4 días") */
function humanDays(n){
  n = Math.round(n);
  if(n <= 0) return 'hoy';
  if(n === 1) return '1 día';
  if(n < 45) return n+' días';
  const meses = Math.floor(n/30.44), resto = Math.round(n - meses*30.44);
  let t = meses+(meses===1?' mes':' meses');
  if(resto >= 1) t += ' y '+resto+(resto===1?' día':' días');
  return t;
}

   3. ESTADO Y PERSISTENCIA
   ============================================================ */
const KEY_REAL   = 'ahorro_objetivos_v1';
const KEY_PRUEBA = 'ahorro_prueba_v1';

// Acceso protegido: hay navegadores y configuraciones de privacidad donde tocar
// localStorage lanza una excepción. Sin esto, la app entera no arranca.
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }

/**
 * El modo prueba usa su propia caja de datos: nada de lo que hagas ahí toca lo real.
 * A propósito NO se recuerda entre sesiones: abrir el archivo siempre te deja en modo real.
 * Si se recordara, podrías cargar ahorros de verdad en el sandbox sin darte cuenta.
 * Los datos de prueba sí quedan guardados, así que no perdés lo que estabas probando.
 */
let testMode = false;
const KEY = () => testMode ? KEY_PRUEBA : KEY_REAL;

/** Categorías de origen/destino de la plata */
const CATS_IN  = ['Sueldo','Changa','Venta','Regalo','Otro'];
const CATS_OUT = ['Gasto','Emergencia','Compra','Otro'];

const DEFAULT_STATE = {
  version: 3,
  settings: {
    theme: 'dark',
    rate: { value: null, source: null, fetchedAt: null },   // ARS por USD (venta)
    fakeToday: null,                                         // solo se usa en modo prueba
    // El sueldo es uno solo y se reparte entre objetivos por porcentaje.
    // Antes vivía dentro de cada objetivo; normalize() migra los datos viejos.
    sueldo: { dia: 5, monto: 0, activo: false, hechos: [] }
  },
  objectives: [],
  activeId: null
};

let state = load();

function load(){
  try{
    const raw = lsGet(KEY());
    const s = raw ? normalize(JSON.parse(raw)) : structuredClone(DEFAULT_STATE);
    fakeToday = testMode ? (s.settings.fakeToday || null) : null;
    return s;
  }catch(e){
    console.warn('No se pudo leer el guardado:', e);
    fakeToday = null;
    return structuredClone(DEFAULT_STATE);
  }
}

/** Rellena campos faltantes para que un JSON viejo o importado no rompa nada */
function normalize(s){
  const base = structuredClone(DEFAULT_STATE);
  if(!s || typeof s !== 'object') return base;
  const out = Object.assign(base, {
    version: 2,
    settings: Object.assign(base.settings, s.settings || {}),
    objectives: Array.isArray(s.objectives) ? s.objectives : [],
    activeId: s.activeId || null
  });
  out.settings.rate = Object.assign({value:null,source:null,fetchedAt:null}, (s.settings&&s.settings.rate)||{});
  out.settings.fakeToday = (s.settings && s.settings.fakeToday) || null;
  const sg = (s.settings && s.settings.sueldo) || null;
  out.settings.sueldo = {
    dia: Math.max(1, Math.min(31, Number(sg && sg.dia) || 5)),
    monto: Number(sg && sg.monto) || 0,
    activo: !!(sg && sg.activo),
    hechos: Array.isArray(sg && sg.hechos) ? sg.hechos.map(String) : []
  };
  out.objectives = out.objectives.map(o => ({
    id: o.id || uid(),
    name: String(o.name || 'Objetivo'),
    targetDate: o.targetDate || addDays(today(), 90),
    startDate: o.startDate || today(),
    archived: !!o.archived,
    // qué porcentaje del sueldo global va a este objetivo
    pctSueldo: Math.max(0, Math.min(100, Number(o.pctSueldo) || 0)),
    // se conserva solo para poder migrar; ya no se usa para calcular
    recurrente: o.recurrente ? {
      dia: Math.max(1, Math.min(31, Number(o.recurrente.dia) || 1)),
      monto: Number(o.recurrente.monto) || 0,
      activo: o.recurrente.activo !== false,
      desde: o.recurrente.desde || mesDe(o.startDate || today()),
      hechos: Array.isArray(o.recurrente.hechos) ? o.recurrente.hechos.map(String) : []
    } : null,
    // fechas de oportunidad propias (las de Black Friday / Navidad se calculan solas)
    fechas: (Array.isArray(o.fechas)?o.fechas:[]).map(f => ({
      id: f.id || uid(), name: String(f.name || 'Fecha'), date: f.date || today()
    })),
    items: (Array.isArray(o.items)?o.items:[]).map((it,i) => ({
      id: it.id || uid(),
      name: String(it.name || 'Ítem'),
      price: Number(it.price) || 0,
      order: Number.isFinite(it.order) ? it.order : i,
      bought: !!it.bought,
      boughtDate: it.boughtDate || null
    })),
    movements: (Array.isArray(o.movements)?o.movements:[]).map(m => ({
      id: m.id || uid(),
      date: m.date || today(),
      amount: Number(m.amount) || 0,          // + aporte / − retiro
      note: String(m.note || ''),
      cat: String(m.cat || ''),               // Sueldo, Changa, Venta, Regalo, Gasto...
      excludeFromRate: !!m.excludeFromRate,   // no cuenta para el promedio semanal
      itemId: m.itemId || null,               // si vino de marcar un ítem como comprado
      recYm: m.recYm || null,                 // si vino de confirmar el sueldo de ese mes
      // etiqueta "te adelantó/atrasó X días" congelada al momento de la carga,
      // para que comprar un ítem o editar precios no reescriba la historia
      diasPlan: Number.isFinite(m.diasPlan) ? m.diasPlan : null
    }))
  }));
  // ---- migración: el sueldo pasó de vivir en cada objetivo a ser uno global
  // repartido por porcentaje. Sumamos los montos viejos y repartimos proporcional.
  const viejos = out.objectives.filter(o => o.recurrente && o.recurrente.monto > 0);
  if(!out.settings.sueldo.monto && viejos.length){
    const total = viejos.reduce((s,o) => s + o.recurrente.monto, 0);
    const activo = viejos.some(o => o.recurrente.activo);
    out.settings.sueldo = {
      dia: viejos[0].recurrente.dia,
      monto: total,
      activo,
      // los meses ya confirmados en cualquier objetivo se dan por hechos
      hechos: [...new Set(viejos.flatMap(o => o.recurrente.hechos))]
    };
    viejos.forEach(o => { o.pctSueldo = Math.round(o.recurrente.monto / total * 100); });
  }
  out.objectives.forEach(o => { delete o.recurrente; });

  if(!out.objectives.some(o => o.id === out.activeId)){
    const first = out.objectives.find(o => !o.archived) || out.objectives[0];
    out.activeId = first ? first.id : null;
  }
  return out;
}

/* ---- sueldo global ---- */
/** Lo que le toca a un objetivo por mes, en USD */
function cuotaSueldo(o){
  const s = state.settings.sueldo;
  if(!s.activo || s.monto <= 0 || !o) return 0;
  return s.monto * (o.pctSueldo || 0) / 100;
}
/** Suma de porcentajes ya asignados, opcionalmente ignorando un objetivo */
function pctAsignado(exceptoId){
  return state.objectives
    .filter(o => o.id !== exceptoId)
    .reduce((s,o) => s + (o.pctSueldo || 0), 0);
}
/** Meses de sueldo que ya vencieron y todavía no confirmaste (es global) */
function sueldosPendientes(){
  const s = state.settings.sueldo, hoy = today(), out = [];
  if(!s.activo || s.monto <= 0) return out;
  const arranque = state.objectives.reduce((min,o) =>
    (!min || o.startDate < min) ? o.startDate : min, null) || hoy;
  let ym = mesDe(arranque);
  const limite = mesDe(hoy);
  while(ym <= limite){
    const f = diaDelMes(ym, s.dia);
    if(diffDays(f, hoy) >= 0 && f >= arranque && !s.hechos.includes(ym)){
      out.push({ ym, fecha: f, monto: s.monto });
    }
    ym = addMes(ym, 1);
  }
  return out;
}
/** Próxima fecha de cobro sin confirmar dentro de (desde, hasta]. null si no hay. */
function proximoCobro(desde, hasta){
  const s = state.settings.sueldo;
  if(!s.activo || s.monto <= 0) return null;
  let ym = mesDe(desde);
  const limite = mesDe(hasta);
  while(ym <= limite){
    const f = diaDelMes(ym, s.dia);
    if(f > desde && f <= hasta && !s.hechos.includes(ym)) return f;
    ym = addMes(ym, 1);
  }
  return null;
}

/* ============================================================
   4. CÁLCULOS
   ============================================================ */

/**
 * Todo el motor del programa. Devuelve las métricas de un objetivo.
 * Convención: los aportes son montos positivos y los retiros negativos.
 */
function compute(o){
  const hoy = today();

  const pending = o.items.filter(i => !i.bought).sort((a,b) => a.order - b.order);
  const bought  = o.items.filter(i =>  i.bought);

  const total = pending.reduce((s,i) => s + i.price, 0);
  const saldo = o.movements.reduce((s,m) => s + m.amount, 0);
  const falta = Math.max(0, total - saldo);
  const sobra = Math.max(0, saldo - total);
  const pct   = total > 0 ? Math.min(1, Math.max(0, saldo/total)) : 0;

  // Días que quedan: hoy no cuenta, el día objetivo sí.
  const diasRestantes = diffDays(hoy, o.targetDate);
  const vencido = diasRestantes < 0;
  const cumplido = total > 0 && falta <= 0.0001;

  const reqDia = diasRestantes > 0 ? falta / diasRestantes : (falta > 0 ? Infinity : 0);

  // ---- ritmo real
  // El origen es lo más viejo entre el arranque del objetivo y el primer movimiento,
  // para que los movimientos cargados con fecha anterior también cuenten al ritmo.
  const origen = o.movements.length
    ? [o.startDate, ...o.movements.map(m => m.date)].sort()[0]
    : o.startDate;

  // La ventana se ancla en tus propios movimientos, no en semanas de calendario.
  // Arranca EN un aporte viejo (que no se suma: marca el inicio del ciclo) y llega hasta hoy.
  // Así, si metés una vez por mes, mide un mes completo y no importa dónde caiga el lunes.
  const MIN_VENTANA = 28;    // nunca menos de 4 semanas, para que no salte con cada aporte
  const MAX_VENTANA = 120;   // nunca más de 4 meses, para que reaccione si frenás

  const cuentan = o.movements
    .filter(m => !m.excludeFromRate && m.date <= hoy)
    .sort((a,b) => a.date.localeCompare(b.date));

  const curWeek = weekStart(hoy);
  const semanaActual = o.movements
    .filter(m => !m.excludeFromRate && m.date >= curWeek && m.date <= hoy)
    .reduce((s,m) => s + m.amount, 0);

  let ritmoSemana = null, ritmoDia = null, ritmoBase = '', ventanaIni = null, ventanaDias = 0;
  // Si el borde de la ventana es un aporte, ese aporte no se suma (marca el inicio del
  // ciclo). Si el borde es un día cualquiera, todo lo que cae en él sí cuenta.
  let anclaEsAporte = false;

  const historia = diffDays(origen, hoy);   // cuántos días de datos hay en total

  if(historia < 7){
    // Con menos de una semana de historia cualquier "ritmo diario" es una
    // extrapolación salvaje de dos o tres días. Mejor no inventar un número.
    ventanaIni = origen;
    ventanaDias = Math.max(1, historia);
    ritmoBase = 'todavía no hay una semana de historia';
  }else{
    if(cuentan.length >= 2){
      // agrandamos hacia atrás hasta tener al menos 28 días y 2 aportes
      for(let i = cuentan.length - 2; i >= 0; i--){
        ventanaIni = cuentan[i].date;
        const span = diffDays(ventanaIni, hoy);
        const n = cuentan.length - 1 - i;
        if((span >= MIN_VENTANA && n >= 2) || span >= MAX_VENTANA) break;
      }
      anclaEsAporte = ventanaIni !== null;
    }
    // Piso real: si el ancla quedó a menos de MIN_VENTANA (o no hubo ancla), la
    // ventana pasa a ser de días fijos. Su borde ya no es un aporte, así que cuenta.
    if(ventanaIni === null || diffDays(ventanaIni, hoy) < MIN_VENTANA){
      ventanaIni = historia >= MIN_VENTANA ? addDays(hoy, -MIN_VENTANA) : origen;
      anclaEsAporte = false;
    }
    if(diffDays(ventanaIni, hoy) > MAX_VENTANA){
      ventanaIni = addDays(hoy, -MAX_VENTANA);
      anclaEsAporte = false;
    }

    ventanaDias = Math.max(1, diffDays(ventanaIni, hoy));
    const netoVentana = cuentan
      .filter(m => anclaEsAporte ? m.date > ventanaIni : m.date >= ventanaIni)
      .reduce((s,m) => s + m.amount, 0);

    if(cuentan.length && netoVentana !== 0){
      ritmoDia = netoVentana / ventanaDias;
      ritmoSemana = ritmoDia * 7;
      ritmoBase = 'últimos ' + ventanaDias + ' días'
        + (anclaEsAporte ? ' · desde tu aporte del ' + fmtShort(ventanaIni) : '');
    }else if(cuentan.length){
      // hay movimientos pero ninguno dentro de la ventana: frenaste de verdad
      ritmoDia = 0; ritmoSemana = 0;
      ritmoBase = 'sin aportes en los últimos ' + ventanaDias + ' días';
    }
  }

  // se mantiene por compatibilidad con el resto de la app
  const semanas = [];

  // ---- sueldos programados
  // Los confirmados se guardan con excludeFromRate, así que el ritmo de arriba mide
  // solo tu ahorro variable. Los futuros se suman aparte en la proyección.
  // La cuota que le toca a ESTE objetivo del sueldo global, según su porcentaje.
  const cuota = cuotaSueldo(o);
  const rec = cuota > 0 ? { dia: state.settings.sueldo.dia, monto: cuota } : null;

  /** Suma de sueldos previstos con fecha en (desde, hasta] */
  function sueldosEntre(desde, hasta){
    if(!rec || diffDays(desde, hasta) <= 0) return 0;
    let n = 0, ym = mesDe(desde);
    const limite = mesDe(hasta);
    while(ym <= limite){
      const f = diaDelMes(ym, rec.dia);
      if(f > desde && f <= hasta) n++;
      ym = addMes(ym, 1);
    }
    return n * rec.monto;
  }

  // los pendientes son globales, no de este objetivo
  const pendientes = rec ? sueldosPendientes() : [];

  // ---- proyección: ritmo variable + sueldos que van cayendo.
  // El ritmo va con su signo: si venís drenando, la fecha lo tiene que reflejar.
  // Si el neto no converge, el bucle no encuentra fecha y se muestra "no llegás".
  const proyectar = (k) => saldo + (ritmoDia || 0) * Math.max(0, diffDays(hoy,k)) + sueldosEntre(hoy, k);

  let fechaEstim = null, diasEstim = null, llegaAntes = null;
  if(cumplido){
    fechaEstim = 'cumplido';
  }else if((ritmoDia && ritmoDia > 0) || rec){
    // avanzamos día a día porque los sueldos son saltos, no una pendiente pareja
    for(let d = 1; d <= 3650; d++){
      if(proyectar(addDays(hoy,d)) >= total - 0.0001){ diasEstim = d; break; }
    }
    if(diasEstim != null){
      fechaEstim = addDays(hoy, diasEstim);
      llegaAntes = diffDays(fechaEstim, o.targetDate);   // + = llega antes de la meta
    }
  }

  // ---- fechas de oportunidad: dónde vas a estar parado en cada una
  const fechasClave = [...fechasConocidas(hoy, o.targetDate),
                       ...(o.fechas||[]).filter(f => f.date > hoy && f.date <= o.targetDate)]
    .sort((a,b) => a.date.localeCompare(b.date))
    .map(f => {
      const proy = proyectar(f.date);
      return {
        ...f,
        proy,
        pct: total > 0 ? Math.min(1, Math.max(0, proy/total)) : 0,
        falta: Math.max(0, total - proy),
        alcanza: proy >= total - 0.0001,
        dias: diffDays(hoy, f.date)
      };
    });

  // sueldos que entran antes de la meta, y cuánto te queda por juntar aparte de eso
  const sueldosHastaMeta = sueldosEntre(hoy, o.targetDate);
  const faltaExtra = Math.max(0, falta - sueldosHastaMeta);
  const reqDiaExtra = diasRestantes > 0 ? faltaExtra / diasRestantes : 0;

  // ---- plan ideal y semáforo
  const planTotalDias = Math.max(1, diffDays(o.startDate, o.targetDate));
  const saldoInicial = o.movements
    .filter(m => diffDays(m.date, o.startDate) >= 0)
    .reduce((s,m) => s + m.amount, 0);
  const transcurridos = Math.min(planTotalDias, Math.max(0, diffDays(o.startDate, hoy)));
  const planDia = (total - saldoInicial) / planTotalDias;
  const deberia = saldoInicial + planDia * transcurridos;
  const desvio = saldo - deberia;
  const diasVentaja = planDia > 0 ? desvio / planDia : 0;

  // La vara del semáforo tiene que ser la misma que usa la proyección: si hay sueldo
  // recurrente, lo que importa es lo que falta APARTE de los sueldos previstos.
  const reqComparable = rec ? reqDiaExtra : reqDia;
  const sueldoCubre = !!rec && sueldosHastaMeta >= falta - 0.0001;

  let semaforo = 'ok';
  if(!cumplido && total > 0){
    if(desvio < -0.005){
      semaforo = (sueldoCubre || (ritmoDia != null && ritmoDia >= reqComparable)) ? 'mid' : 'bad';
    }else if(ritmoDia != null && ritmoDia <= 0 && falta > 0 && !sueldoCubre){
      // al día con el plan, pero frenaste: no puede leerse como verde
      // (salvo que los sueldos previstos ya cubran solos lo que falta)
      semaforo = 'mid';
    }
  }

  // ---- cascada: se llena un ítem entero antes de empezar el siguiente
  let resto = Math.max(0, saldo);
  const cascada = pending.map(i => {
    const cubierto = Math.min(resto, i.price);
    resto -= cubierto;
    return { item:i, cubierto, pct: i.price > 0 ? cubierto/i.price : 1, listo: cubierto >= i.price - 0.0001 };
  });

  const totalOriginal = total + bought.reduce((s,i) => s + i.price, 0);

  return {
    hoy, pending, bought, total, totalOriginal, saldo, falta, sobra, pct,
    diasRestantes, vencido, cumplido, reqDia,
    semanas, semanaActual, ritmoSemana, ritmoDia, ritmoBase, ventanaIni, ventanaDias,
    fechaEstim, diasEstim, llegaAntes,
    deberia, desvio, diasVentaja, semaforo, planDia, saldoInicial, planTotalDias,
    cascada,
    rec, pendientes, fechasClave, sueldosHastaMeta, faltaExtra, reqDiaExtra,
    reqComparable, sueldoCubre, proyectar
  };
}

/**
 * Cuántos días de plan cubre un monto. Se mide contra el ritmo del plan original,
 * no contra el requerido de hoy, para que la etiqueta de un movimiento viejo
 * no cambie con el paso del tiempo.
 */
function diasQueMueve(monto, c){
  if(!c.planDia || c.planDia <= 0) return null;
  const d = monto / c.planDia;
  if(Math.abs(d) < 0.5) return null;
  return Math.round(d);
}

/* ============================================================
   5. COTIZACIÓN DEL DÓLAR (BNA venta)
   ============================================================ */
async function fetchRate(){
  const fuentes = [
    { url:'https://dolarapi.com/v1/dolares/oficial',
      pick: j => ({ v: Number(j.venta), t: j.fechaActualizacion }), src:'BNA' },
    { url:'https://api.bluelytics.com.ar/v2/latest',
      pick: j => ({ v: Number(j.oficial.value_sell), t: j.last_update }), src:'oficial' }
  ];
  for(const f of fuentes){
    try{
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 7000);
      const res = await fetch(f.url, { signal: ctrl.signal, cache:'no-store' });
      clearTimeout(to);
      if(!res.ok) continue;
      const j = await res.json();
      const { v, t } = f.pick(j);
      if(!v || !isFinite(v) || v <= 0) continue;
      state.settings.rate = { value: v, source: f.src, fetchedAt: t || new Date().toISOString() };
      save(); renderRate(); render();
      return true;
    }catch(e){ /* probamos la siguiente */ }
  }
  renderRate();   // se queda con la última guardada o pide que la cargues a mano
  return false;
}

function renderRate(){
  const r = state.settings.rate;
  const val = document.getElementById('rateVal');
  const src = document.getElementById('rateSrc');
  const dot = document.getElementById('rateDot');
  // la cotización se mudó al panel lateral: si el panel está cerrado no hay nada que pintar
  if(!val || !src || !dot){
    if(drawer && drawer.classList.contains('show')) renderDrawer();
    return;
  }
  if(!r.value){
    val.textContent = 'sin dato';
    src.textContent = '· cargala a mano';
    dot.className = 'live stale';
    return;
  }
  val.textContent = '$'+nfARS.format(Math.round(r.value));
  let edad = '';
  if(r.fetchedAt){
    const d = new Date(r.fetchedAt);
    if(!isNaN(d)) edad = ' · '+fmtDate(toKey(d));
  }
  const stale = r.fetchedAt ? (Date.now() - new Date(r.fetchedAt).getTime()) > 3*86400000 : true;
  src.textContent = (r.source === 'manual' ? '· a mano' : '· '+(r.source||'auto')) + edad;
  dot.className = 'live' + (stale ? ' stale' : '');
}

/* ============================================================
   6. MODAL
   ============================================================ */
const ov = document.getElementById('ov');
let onCloseModal = null;

function modal(title, bodyHTML, buttons, afterOpen, cls){
  const box = ov.querySelector('.modal');
  box.className = 'modal' + (cls ? ' '+cls : '');
  const t = document.getElementById('mTitle');
  t.textContent = title;
  t.style.display = title ? '' : 'none';
  document.getElementById('mBody').innerHTML = bodyHTML;
  const foot = document.getElementById('mFoot');
  foot.innerHTML = '';
  (buttons||[]).forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls||'ghost');
    el.textContent = b.label;
    el.onclick = b.onClick;
    foot.appendChild(el);
  });
  ov.classList.add('show');
  if(afterOpen) afterOpen();
}
function closeModal(){ ov.classList.remove('show'); onCloseModal = null; }
ov.addEventListener('mousedown', e => { if(e.target === ov) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && ov.classList.contains('show')) closeModal(); });

/* ============================================================
   7. RENDER — TABS
   ============================================================ */
/**
 * Las pestañas se fueron al lápiz. Esto quedó como el resumen global de la barra
 * superior; se sigue llamando renderTabs para no tocar las decenas de llamadas.
 */
function renderTabs(){
  const chip = document.getElementById('globalChip');
  const activos = state.objectives.filter(o => !o.archived);
  if(activos.length > 1){
    const t = activos.reduce((s,o) => s + o.movements.reduce((a,m) => a+m.amount, 0), 0);
    chip.style.display = '';
    chip.innerHTML = `Total <b class="num">${usd0(t)} USD</b>`;
  }else{
    chip.style.display = 'none';
  }
}

/* ============================================================
   8. RENDER — VISTA PRINCIPAL
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  const o = activeObj();

  if(!o){
    app.innerHTML = `<div class="card"><div class="card-b empty">
      <h2>Todavía no tenés ningún objetivo</h2>
      <p>Creá uno con su fecha meta, cargale adentro las cosas que querés comprar,
         y la app te va a decir cuántos dólares por día necesitás juntar para llegar.</p>
      <button class="btn primary" id="firstBtn">+ Crear mi primer objetivo</button>
    </div></div>`;
    document.getElementById('firstBtn').onclick = () => objModal(null);
    return;
  }

  const c = compute(o);
  app.innerHTML =
      heroHTML(o,c)
    + itemsHTML(o,c)
    + movHTML(o,c)
    + `<div id="chartBox">${chartHTML(o,c)}</div>`;

  wire(o,c);
}

/* ---- hero + métricas ---- */
function heroHTML(o,c){
  const R = 78, C = 2*Math.PI*R;
  const dash = C * c.pct;

  // proyección
  let projVal, projSub, projCls = '';
  if(c.cumplido){
    projVal = '¡Listo!'; projSub = 'objetivo cumplido'; projCls = 'acc';
  }else if(c.fechaEstim){
    projVal = fmtLong(c.fechaEstim);
    if(c.llegaAntes > 0){ projSub = humanDays(c.llegaAntes)+' antes de la meta'; projCls = 'acc'; }
    else if(c.llegaAntes === 0){ projSub = 'justo en la fecha'; projCls = 'acc'; }
    else { projSub = humanDays(-c.llegaAntes)+' tarde'; projCls = 'bad'; }
  }else if(c.ritmoDia == null){
    projVal = 'Sin datos todavía'; projSub = 'cargá aportes y en unos días te lo digo';
    projCls = '';
  }else{
    projVal = 'A este ritmo no llegás'; projSub = c.ritmoBase;
    projCls = 'bad';
  }
  const projSm = (!c.fechaEstim || c.cumplido) ? ' sm' : '';

  // ritmo
  let ritmoVal, ritmoSub;
  if(c.ritmoDia == null){
    ritmoVal = '—'; ritmoSub = c.ritmoBase || 'sin movimientos todavía';
  }else{
    ritmoVal = usd0(c.ritmoDia)+'<span class="unit">/día</span>';
    ritmoSub = usd(c.ritmoSemana)+' por semana · '+c.ritmoBase;
  }
  const ritmoCls = (c.ritmoDia != null && c.reqDia !== Infinity && c.ritmoDia >= c.reqDia) ? 'acc'
                 : (c.ritmoDia != null && c.ritmoDia <= 0) ? 'bad' : '';

  // requerido
  let reqVal, reqSub;
  if(c.cumplido){ reqVal = '0,00'; reqSub = 'ya lo tenés'; }
  else if(c.diasRestantes <= 0){ reqVal = '—'; reqSub = 'la fecha ya pasó'; }
  else if(c.rec && c.sueldosHastaMeta > 0){
    reqVal = usd0(c.reqDiaExtra)+'<span class="unit">/día</span>';
    reqSub = 'aparte del sueldo · entran ' + usd(c.sueldosHastaMeta) + ' USD hasta la meta';
  }
  else { reqVal = usd0(c.reqDia)+'<span class="unit">/día</span>'; reqSub = (ars(c.reqDia)||'') + ' · ' + usd(c.reqDia*7) + ' por semana'; }

  // estado
  let stCls = c.semaforo, stIco, stTxt;
  if(c.total <= 0 && !c.bought.length){
    stIco = ico('ledger'); stCls = '';
    stTxt = `<b>Falta cargar qué querés comprar.</b> Agregá los ítems acá abajo con su precio en dólares `
          + `y la app calcula sola cuánto tenés que juntar por día para llegar al ${fmtLong(o.targetDate)}.`;
  }else if(c.cumplido){
    stIco = ico('check');
    stTxt = `<b>Objetivo cumplido.</b> Juntaste los ${usd(c.total)} USD`
          + (c.sobra > 0.005 ? ` y te sobran ${usd(c.sobra)} USD.` : '.')
          + ` Marcá los ítems como comprados a medida que los vayas comprando.`;
    stCls = 'ok';
  }else if(c.vencido){
    stIco = ico('alert'); stCls = 'bad';
    stTxt = `<b>La fecha meta ya pasó</b> (${fmtDate(o.targetDate)}) y todavía faltan ${usd(c.falta)} USD. Poné una fecha nueva abajo, en los ajustes del objetivo.`;
  }else if(c.ritmoDia == null && c.sueldoCubre){
    // ahorra solo por sueldo: sin ritmo variable, pero el plan de sueldos alcanza
    stIco = ico('check'); stCls = 'ok';
    stTxt = `<b>Vas con el plan de sueldos.</b> Los aportes previstos `
          + `(${usd(c.sueldosHastaMeta)} USD hasta la meta) cubren lo que falta`
          + (c.fechaEstim && c.fechaEstim !== 'cumplido' ? `: a ese paso llegás el ${fmtLong(c.fechaEstim)}.` : '.');
  }else if(c.ritmoDia == null){
    stIco = ico('spark'); stCls = '';
    stTxt = `<b>Recién arrancás.</b> Andá cargando tus aportes en dólares a medida que ahorres. `
          + `Cuando haya una semana de historia te muestro tu ritmo real y en qué fecha llegás. `
          + `Por ahora la meta pide <b>${usd(c.rec ? c.reqDiaExtra : c.reqDia)} USD por día`
          + `${c.rec ? ' aparte del sueldo' : ''}</b>.`;
  }else{
    const d = Math.abs(c.desvio), dias = Math.abs(Math.round(c.diasVentaja));
    if(c.desvio >= -0.005 && c.ritmoDia != null && c.ritmoDia <= 0 && !c.sueldoCubre){
      stIco = ico('alert');
      stTxt = `<b>Estás al día con el plan, pero frenaste.</b> `
            + `En los ${c.ventanaDias} días de la ventana tu saldo ${c.ritmoDia < 0 ? 'bajó' : 'no se movió'}. `
            + `Si no volvés a meter, la fecha del ${fmtLong(o.targetDate)} no se cumple.`;
    }else if(c.desvio >= -0.005){
      stIco = ico('check');
      stTxt = `<b>Vas bien.</b> A hoy el plan pedía ${usd(c.deberia)} USD y tenés ${usd(c.saldo)}: `
            + `estás <b>${usd(d)} USD adelante</b>`
            + (dias >= 1 ? `, unos ${dias} día${dias===1?'':'s'} de ventaja.` : '.');
    }else if(c.semaforo === 'mid'){
      stIco = ico('alert');
      stTxt = `<b>Vas un poco atrás del plan.</b> `
            + `A hoy pedía ${usd(c.deberia)} USD y tenés ${usd(c.saldo)}: te faltan <b>${usd(d)} USD</b>`
            + (dias >= 1 ? `, unos ${dias} día${dias===1?'':'s'} de atraso. ` : '. ')
            + (c.sueldoCubre
                ? `Con los sueldos previstos (${usd(c.sueldosHastaMeta)} USD hasta la meta) llegás igual.`
                : `Al ritmo actual lo recuperás.`);
    }else{
      stIco = ico('alert');
      stTxt = `<b>Vas atrasado.</b> A hoy el plan pedía ${usd(c.deberia)} USD y tenés ${usd(c.saldo)} `
            + `(<b>${usd(d)} USD</b> abajo`+(dias>=1?`, ${dias} día${dias===1?'':'s'}`:'')+`). `
            + (c.reqComparable === Infinity || c.reqComparable <= 0 ? ''
               : `Para llegar necesitás pasar a ${usd(c.reqComparable)} USD por día${c.rec ? ' aparte del sueldo' : ''}.`);
    }
  }

  const diasTxt = c.vencido ? 'fecha vencida'
    : c.diasRestantes === 0 ? '¡es hoy!'
    : 'faltan <b>'+c.diasRestantes+'</b> día'+(c.diasRestantes===1?'':'s');

  return `<div class="card">
    <div class="card-b" style="padding-top:20px">
      <div class="hero">
        <div class="hero-main">
          <div class="eyebrow">${ico('target')} Objetivo</div>
          <div class="h-title"><h1>${esc(o.name)}</h1></div>
          <div class="h-figure">
            ${fig(usd0(c.saldo), 'USD', 'xl')}
            <div class="sub">de <b>${usd0(c.total)} USD</b><br>${ars(c.total)||''}</div>
          </div>
          <div class="h-meta">
            <span>${fmtLong(o.targetDate)}</span><span class="dot-sep"></span>
            <span>${diasTxt}</span>
            ${c.bought.length ? '<span class="dot-sep"></span><span><b>'+c.bought.length+'</b> ya comprado'+(c.bought.length===1?'':'s')+'</span>' : ''}
          </div>
          <div class="status ${stCls}"><span class="ico">${stIco}</span><span>${stTxt}</span></div>
        </div>
        <div class="ring">
          <svg viewBox="0 0 188 188">
            <circle cx="94" cy="94" r="${R}" fill="none" stroke="var(--card-3)" stroke-width="9"/>
            <circle cx="94" cy="94" r="${R}" fill="none" stroke="var(--acc)" stroke-width="9"
              stroke-linecap="round" stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}"
              style="transition:stroke-dasharray .7s var(--ease)"/>
          </svg>
          <div class="rt">
            <div class="pct">${(c.pct*100).toFixed(c.pct>=1?0:1)}<span style="font-size:.45em;color:var(--muted)">%</span></div>
            <div class="of">Completado</div>
          </div>
        </div>
      </div>

      <div class="mgrid">
        <div class="m">
          <div class="lbl">Te falta</div>
          <div class="val num">${usd0(c.falta)}<span class="unit">USD</span></div>
          <div class="sub num">${ars(c.falta)||'—'}</div>
        </div>
        <div class="m">
          <div class="lbl">Necesitás juntar</div>
          <div class="val num acc">${reqVal}</div>
          <div class="sub num">${reqSub}</div>
        </div>
        <div class="m">
          <div class="lbl">Tu ritmo real</div>
          <div class="val num ${ritmoCls}">${ritmoVal}</div>
          ${sparkline(o, c.hoy, 30)}
          <div class="sub num">${ritmoSub}</div>
        </div>
        <div class="m">
          <div class="lbl">A este ritmo llegás</div>
          <div class="val ${projCls}${projSm}">${projVal}</div>
          <div class="sub">${projSub}</div>
        </div>
      </div>
    </div>
    ${pendHTML(o,c)}
    <div class="quick">
      <button class="btn primary big" id="qAdd">${ico('plus')} Agregar plata</button>
      <button class="btn big" id="qSub">${ico('minus')} Sacar</button>
      <span class="qsp"></span>
      <span class="qlbl">${fmtDate(c.hoy)}</span>
    </div>
  </div>`;
}

/** Sueldo global que ya venció y espera confirmación. El monto es editable. */
function pendHTML(o,c){
  const pend = sueldosPendientes();
  if(!pend.length) return '';
  const p = pend[0];
  const reparto = state.objectives.filter(x => (x.pctSueldo||0) > 0)
    .map(x => esc(x.name)+' '+x.pctSueldo+'%').join(' · ');
  const extra = pend.length > 1
    ? ` <span style="color:var(--muted)">(y ${pend.length-1} mes${pend.length>2?'es':''} más atrasado${pend.length>2?'s':''})</span>` : '';
  return `<div class="pend">
    <span class="pend-t">Te toca el sueldo del <b>${fmtDate(p.fecha)}</b>.${extra}
      ${reparto ? '<small>Se reparte en: '+reparto+'</small>'

    <button class="btn sm" data-pend-skip="${p.ym}">Este mes no</button>

/* ---- ítems ---- */
let itemCur = 'usd';   // moneda elegida para cargar precios; se mantiene entre renders

/** Pasa un precio a USD. Devuelve null si hace falta cotización y no hay. */
function aUSD(valor, moneda){
  if(moneda !== 'ars') return valor;
  const r = state.settings.rate.value;
  if(!r || r <= 0) return null;
  return valor / r;
}
